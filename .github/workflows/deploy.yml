name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm test
      - name: Build domestic frontend
        run: |
          npm run build:web
          mkdir -p deployment-artifacts/domestic
          cp -a dist/frontend/. deployment-artifacts/domestic/
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      - name: Build overseas frontend
        run: |
          npm run build:web:overseas
          mkdir -p deployment-artifacts/overseas
          cp -a dist/frontend/. deployment-artifacts/overseas/

      - uses: actions/upload-artifact@v4
        with:
          name: production-dist
          path: deployment-artifacts
          if-no-files-found: error

  deploy:
    needs: check
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 100
          path: deployment-source

      - uses: actions/download-artifact@v4
        with:
          name: production-dist
          path: deployment-artifacts

      - name: Create incremental deployment bundle
        shell: bash
        run: |
          cd deployment-source
          git branch -f codex-deploy "$GITHUB_SHA"
          base="$(git rev-list --first-parent --max-count=100 "$GITHUB_SHA" | tail -1)"
          bundle="../tsukuyomi-deployment-${GITHUB_RUN_ID}.bundle"
          if [ "$base" = "$GITHUB_SHA" ]; then
            git bundle create "$bundle" refs/heads/codex-deploy
          else
            git bundle create "$bundle" refs/heads/codex-deploy "^$base"
          fi
          git bundle verify "$bundle"

      - name: Upload domestic and overseas frontends
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: deployment-artifacts
          target: /tmp/tsukuyomi-prebuilt-${{ github.run_id }}
          overwrite: true

      - name: Upload deployment bundle
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: tsukuyomi-deployment-${{ github.run_id }}.bundle
          target: /tmp
          overwrite: true

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            app=/var/www/tsukuyomi-space
            bundle=/tmp/tsukuyomi-deployment-${{ github.run_id }}.bundle
            prebuilt=/tmp/tsukuyomi-prebuilt-${{ github.run_id }}
            artifact_root="$prebuilt/deployment-artifacts"
            if [ ! -f "$artifact_root/domestic/index.html" ] && [ -f "$prebuilt/domestic/index.html" ]; then
              artifact_root="$prebuilt"
            fi
            domestic="$artifact_root/domestic"
            overseas="$artifact_root/overseas"
            overseas_container=
            overseas_index=
            for candidate in $(docker ps --format '{{.Names}}' | awk '/^1Panel-openresty-/'); do
              candidate_index="$(docker exec "$candidate" find /www/sites -maxdepth 5 -type f -path '*/tsukuyomi-space.com/*' -name index.html -print -quit 2>/dev/null || true)"
              if [ -n "$candidate_index" ]; then
                overseas_container="$candidate"
                overseas_index="$candidate_index"
                break
              fi
            done
            overseas_root="${overseas_index%/index.html}"
            case "$prebuilt" in
              /tmp/tsukuyomi-prebuilt-[0-9]*) ;;
              *) echo "Invalid prebuilt path" >&2; exit 1 ;;
            esac
            trap 'rm -f "$bundle"; rm -rf -- "$prebuilt"' EXIT
            test -d "$app" || { echo "Application directory is missing" >&2; exit 1; }
            test -n "$overseas_container" || { echo "Running 1Panel OpenResty container is missing" >&2; exit 1; }
            case "$overseas_root" in
              /www/sites/tsukuyomi-space.com/*) ;;
              *) echo "Invalid overseas frontend directory" >&2; exit 1 ;;
            esac
            docker exec "$overseas_container" test -d "$overseas_root" || { echo "Overseas frontend directory is missing in OpenResty" >&2; exit 1; }
            test -f "$domestic/index.html" || { echo "Domestic frontend artifact is missing" >&2; exit 1; }
            test -f "$overseas/index.html" || { echo "Overseas frontend artifact is missing" >&2; exit 1; }
            cd "$app"
            git fetch "$bundle" refs/heads/codex-deploy
            test "$(git rev-parse FETCH_HEAD)" = "${{ github.sha }}"
            git -c core.hooksPath=/dev/null merge --ff-only FETCH_HEAD
            install -d -m 0755 "$app/dist/frontend"
            cp -a "$domestic/." "$app/dist/frontend/"
            docker cp "$overseas/." "$overseas_container:$overseas_root/"
            INSTALL_NGINX_CONFIG=true HARDEN_OPENRESTY_ORIGIN=true bash deploy/deploy.sh
