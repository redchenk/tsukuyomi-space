name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build:web
      - run: npm run build:live2d
      - run: npm run build:live2d-studio
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        with:
          name: production-dist
          path: |
            dist
            lib/bundled/live2d-room-neuro-live.iife.js
            lib/bundled/live2d-room-neuro-live.20260717-adaptive-perf-r8.iife.js
          if-no-files-found: error

  deploy:
    needs: check
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 100
          path: deployment-source

      - uses: actions/download-artifact@v4
        with:
          name: production-dist

      - name: Create incremental deployment bundle
        shell: bash
        run: |
          cd deployment-source
          git branch -f codex-deploy "$GITHUB_SHA"
          base="$(git rev-list --first-parent --max-count=100 "$GITHUB_SHA" | tail -1)"
          bundle="../tsukuyomi-deployment-${GITHUB_RUN_ID}.bundle"
          if [ "$base" = "$GITHUB_SHA" ]; then
            git bundle create "$bundle" refs/heads/codex-deploy
          else
            git bundle create "$bundle" refs/heads/codex-deploy "^$base"
          fi
          git bundle verify "$bundle"

      - name: Upload prebuilt frontend
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: dist,lib/bundled/live2d-room-neuro-live.iife.js,lib/bundled/live2d-room-neuro-live.20260717-adaptive-perf-r8.iife.js
          target: /tmp/tsukuyomi-prebuilt-${{ github.run_id }}
          overwrite: true

      - name: Upload deployment bundle
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: tsukuyomi-deployment-${{ github.run_id }}.bundle
          target: /tmp
          overwrite: true

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            app=/var/www/tsukuyomi-space
            bundle=/tmp/tsukuyomi-deployment-${{ github.run_id }}.bundle
            prebuilt=/tmp/tsukuyomi-prebuilt-${{ github.run_id }}
            case "$prebuilt" in
              /tmp/tsukuyomi-prebuilt-[0-9]*) ;;
              *) echo "Invalid prebuilt path" >&2; exit 1 ;;
            esac
            trap 'rm -f "$bundle"; rm -rf -- "$prebuilt"' EXIT
            cd "$app"
            git restore --worktree -- lib/bundled/live2d-room-neuro-live.iife.js
            git fetch "$bundle" refs/heads/codex-deploy
            test "$(git rev-parse FETCH_HEAD)" = "${{ github.sha }}"
            git -c core.hooksPath=/dev/null merge --ff-only FETCH_HEAD
            test -f "$prebuilt/dist/frontend/index.html"
            test -f "$prebuilt/lib/bundled/live2d-room-neuro-live.iife.js"
            test -f "$prebuilt/lib/bundled/live2d-room-neuro-live.20260717-adaptive-perf-r8.iife.js"
            cp -a "$prebuilt/dist/." "$app/dist/"
            install -m 0644 "$prebuilt/lib/bundled/live2d-room-neuro-live.iife.js" "$app/lib/bundled/live2d-room-neuro-live.iife.js"
            install -m 0644 "$prebuilt/lib/bundled/live2d-room-neuro-live.20260717-adaptive-perf-r8.iife.js" "$app/lib/bundled/live2d-room-neuro-live.20260717-adaptive-perf-r8.iife.js"
            INSTALL_NGINX_CONFIG=true HARDEN_OPENRESTY_ORIGIN=true bash deploy/deploy.sh
