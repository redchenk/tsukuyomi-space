name: Publish Moon Chat transport fallback overseas

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/codex/moon-chat-overseas-rollout'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 76a9b9afe7f0aa096f98e8867655b9a7025ed838
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: npm
      - run: npm ci
      - name: Build the pinned Moon Chat frontend
        run: |
          set -eu
          npm run build:web:overseas
          echo '55c5454ae051a5e35cc73ea28b77b86a87a67b744d1ae913296349f308a892c5  dist/frontend/index.html' | sha256sum -c -
          cat > "$RUNNER_TEMP/activate.py" <<'RELEASE_DATA'
          from pathlib import Path
          import json,hashlib,os,shutil,subprocess,sys,tempfile,time
          stage=Path(sys.argv[1]); label=sys.argv[2]; config=Path('/opt/1panel/www/conf.d/tsukuyomi-space.com.conf')
          root=Path('/opt/1panel/www/sites/tsukuyomi-space.com/frontend');state=Path('/var/backups/tsukuyomi-space/releases')/label
          meta=json.loads((stage/'manifest.json').read_text());host='tsukuyomi-space.com'
          sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          def run(*args):subprocess.run([str(x) for x in args],check=True)
          def output(*args):return subprocess.check_output([str(x) for x in args])
          def get(path):return output('curl','-fsS','--retry','3','--retry-all-errors','--retry-delay','2','--max-time','20','--resolve',host+':443:127.0.0.1','https://'+host+path)
          containers=[s for s in output('docker','ps','--format','{{.Names}}').decode().splitlines() if s.lower().startswith('1panel-openresty-')]
          assert len(containers)==1
          def reload():run('docker','exec',containers[0],'nginx','-t');run('docker','exec',containers[0],'nginx','-s','reload')
          def put(data):
           stat=config.stat()
           with tempfile.NamedTemporaryFile(dir=config.parent,delete=False) as f:
            tmp=f.name;f.write(data);os.fchown(f.fileno(),stat.st_uid,stat.st_gid);os.fchmod(f.fileno(),stat.st_mode&0o777)
           os.replace(tmp,config)
          def verify():
           assert sha(root/'index.html')==meta['after']
           assert hashlib.sha256(get('/chatroom')).hexdigest()==meta['after']
           assert json.loads(get('/api/chatroom/lobby/sync'))['data']['packets'][0]['type']=='snapshot'
           assert json.loads(get('/api/health'))['status']=='ok'
          if sha(root/'index.html')==meta['after']:
           verify();sys.exit(0)
          assert sha(root/'index.html')==meta['before'],'Overseas frontend advanced'
          assert 'location = /api/chatroom/live' in config.read_text()
          run('bash',stage/'prepare-lightweight-release.sh','--site','overseas','--state',state,'--root',root,'--frontend',root,'--artifact',stage/'frontend','--base-url','https://'+host,'--resolve',host+':443:127.0.0.1','--commit',meta['commit'],'--frontend-only')
          assert sha(root/'index.html')==meta['before']
          activated=False
          try:
           activated=True
           run('python3',stage/'safe-release.py','activate','--state',state)
           verify()
          except BaseException:
           if activated:run('python3',stage/'safe-release.py','rollback','--state',state)
           raise
          print('Verified Moon Chat overseas',meta['commit'])
          RELEASE_DATA
          cat > "$RUNNER_TEMP/manifest.json" <<'RELEASE_DATA'
          {"commit": "76a9b9afe7f0aa096f98e8867655b9a7025ed838", "before": "758b3e50e27d10542c4fa49e2149160138d64aa9d05f35115a2469d8fa09874b", "after": "55c5454ae051a5e35cc73ea28b77b86a87a67b744d1ae913296349f308a892c5"}
          RELEASE_DATA
          cat > "$RUNNER_TEMP/live.block" <<'RELEASE_DATA'
          location = /api/chatroom/live {
                  proxy_pass https://yachiyo.hk;
                  proxy_http_version 1.1;
                  proxy_ssl_server_name on;
                  proxy_ssl_verify on;
                  proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
                  proxy_ssl_name yachiyo.hk;
                  proxy_buffering off;
                  proxy_read_timeout 1h;
                  proxy_set_header Host yachiyo.hk;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $remote_addr;
                  proxy_set_header X-Forwarded-Proto https;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection "upgrade";
                  include /usr/local/openresty/nginx/conf/conf.d/_tsukuyomi-space-security-headers.inc;
              }
          RELEASE_DATA
          cat > "$RUNNER_TEMP/page.block" <<'RELEASE_DATA'
          location ~ ^/chatroom/?$ {
                  try_files /index.html =404;
                  add_header X-Robots-Tag "noindex, follow" always;
                  add_header Cache-Control "private, no-store" always;
                  include /usr/local/openresty/nginx/conf/conf.d/_tsukuyomi-space-security-headers.inc;
              }
          RELEASE_DATA
          tar -czf "$RUNNER_TEMP/moon-chat-release.tgz" -C dist frontend -C "$GITHUB_WORKSPACE/deploy" safe-release.py prepare-lightweight-release.sh -C "$RUNNER_TEMP" activate.py manifest.json live.block page.block
      - name: Verify the overseas SSH host
        env:
          SERVER: ${{ secrets.OVERSEAS_SERVER_HOST }}
          PORT: ${{ secrets.OVERSEAS_SERVER_PORT || 47388 }}
        run: |
          command -v sshpass >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq sshpass; }
          ssh-keyscan -T 12 -p "$PORT" -t ed25519 "$SERVER" > "$RUNNER_TEMP/overseas-known-hosts" 2>/dev/null
          test "$(ssh-keygen -lf "$RUNNER_TEMP/overseas-known-hosts" | awk '{print $2}' | sort -u)" = 'SHA256:iWgrq0f82PS81s/NNfMp622ag23vLk83CyHruht53xA'
      - name: Publish and verify the overseas frontend
        env:
          SERVER: ${{ secrets.OVERSEAS_SERVER_HOST }}
          PORT: ${{ secrets.OVERSEAS_SERVER_PORT || 47388 }}
          LOGIN: ${{ secrets.OVERSEAS_SERVER_USER || 'root' }}
          SSHPASS: ${{ secrets.OVERSEAS_SERVER_PASSWORD }}
        run: |
          set -euo pipefail
          opts=(-o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/overseas-known-hosts" -o HostKeyAlgorithms=ssh-ed25519 -o PreferredAuthentications=password -o NumberOfPasswordPrompts=1 -o ConnectTimeout=15)
          for attempt in 1 2 3; do
            label="moon-chat-sync-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$attempt"
            stage="/tmp/tsukuyomi-$label"
            echo "Starting upload and activation (attempt $attempt)"
            if sshpass -e ssh -T "${opts[@]}" -p "$PORT" "$LOGIN@$SERVER" \
              "set -eu; mkdir -m 700 '$stage'; cat > '$stage/release.tgz'; tar -xzf '$stage/release.tgz' -C '$stage'; flock -w 120 /run/lock/tsukuyomi-room-frontend.lock python3 '$stage/activate.py' '$stage' '$label'" \
              < "$RUNNER_TEMP/moon-chat-release.tgz"; then
              exit 0
            else
              result=$?
            fi
            if [[ "$result" != 255 || "$attempt" == 3 ]]; then exit "$result"; fi
            sleep 8
          done
