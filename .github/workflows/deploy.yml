name: Moonlight Door scroll regression
on: workflow_dispatch
permissions:
  contents: read
env:
  ENTRY_CANDIDATE: 62d7a349210566b7371335ffe3090092546a7ea8
jobs:
  scroll:
    if: github.ref == 'refs/heads/codex/moonlight-entry-scroll-check'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.ENTRY_CANDIDATE }}
          persist-credentials: false
          fetch-depth: 2
      - name: Verify only the scroll test changed after the build
        run: |
          test "$(git rev-parse HEAD)" = "$ENTRY_CANDIDATE"
          test "$(git rev-parse HEAD^)" = '5663678f4dee81efa7be6561d96e02f132eac7c4'
          test "$(git diff --name-only HEAD^ HEAD)" = 'tests/e2e/site-background.spec.js'
      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: npm
      - run: npm ci
      - run: npm run build:web
      - name: Install Chromium and system dependencies
        timeout-minutes: 10
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
          npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --project=chromium --project=chromium-mobile tests/e2e/site-background.spec.js tests/e2e/access-transition.spec.js
