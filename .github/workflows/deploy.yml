name: Publish the Drift reply update overseas

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/codex/drift-feedback-overseas-rollout'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9108431783612aecd4b29f626a3dbb6f3a676f19
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: npm
      - run: npm ci
      - name: Test the reply and return APIs and build the English site
        run: |
          node --test tests/drift-api.test.js tests/drift-submission.test.js tests/frontend-drift-concurrency.test.js tests/frontend-drift-submission.test.js
          npm run build:web:overseas
          grep -Fq '/assets/index-DFnf3AdL.js' dist/frontend/index.html
          test -f dist/frontend/assets/DriftPage-B9ZuXP7-.js
          tar -czf "$RUNNER_TEMP/drift-release.tgz" -C dist frontend -C "$GITHUB_WORKSPACE/deploy" safe-release.py prepare-lightweight-release.sh
      - name: Verify the overseas SSH host
        env:
          SERVER: ${{ secrets.OVERSEAS_SERVER_HOST }}
          PORT: ${{ secrets.OVERSEAS_SERVER_PORT || 47388 }}
        run: |
          command -v sshpass >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq sshpass; }
          ssh-keyscan -T 12 -p "$PORT" -t ed25519 "$SERVER" > "$RUNNER_TEMP/overseas-known-hosts" 2>/dev/null
          test "$(ssh-keygen -lf "$RUNNER_TEMP/overseas-known-hosts" | awk '{print $2}' | sort -u)" = 'SHA256:iWgrq0f82PS81s/NNfMp622ag23vLk83CyHruht53xA'
      - name: Publish and verify the overseas frontend
        env:
          SERVER: ${{ secrets.OVERSEAS_SERVER_HOST }}
          PORT: ${{ secrets.OVERSEAS_SERVER_PORT || 47388 }}
          LOGIN: ${{ secrets.OVERSEAS_SERVER_USER || 'root' }}
          SSHPASS: ${{ secrets.OVERSEAS_SERVER_PASSWORD }}
        run: |
          set -euo pipefail
          opts=(-o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/overseas-known-hosts" -o HostKeyAlgorithms=ssh-ed25519 -o PreferredAuthentications=password -o NumberOfPasswordPrompts=1 -o ConnectTimeout=15)
          label="drift-reply-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          stage="/tmp/tsukuyomi-$label"
          sshpass -e ssh "${opts[@]}" -p "$PORT" "$LOGIN@$SERVER" "umask 077 && mkdir '$stage'"
          sshpass -e scp "${opts[@]}" -P "$PORT" "$RUNNER_TEMP/drift-release.tgz" "$LOGIN@$SERVER:$stage/"
          sshpass -e ssh "${opts[@]}" -p "$PORT" "$LOGIN@$SERVER" bash -s -- "$stage" "$label" <<'REMOTE'
          set -euo pipefail
          stage="$1"
          state="/var/backups/tsukuyomi-space/releases/$2"
          root=/opt/1panel/www/sites/tsukuyomi-space.com/frontend
          url=https://tsukuyomi-space.com
          baseline=cbd9cfce0dbe9d03d982716a36175057eb32ed5354e95301f6d1341f0a140042
          test "$(sha256sum "$root/index.html" | cut -d' ' -f1)" = "$baseline"
          tar -xzf "$stage/drift-release.tgz" -C "$stage"
          bash "$stage/prepare-lightweight-release.sh" --site overseas --state "$state" --root "$root" --frontend "$root" --artifact "$stage/frontend" --base-url "$url" --resolve tsukuyomi-space.com:443:127.0.0.1 --commit 9108431783612aecd4b29f626a3dbb6f3a676f19 --frontend-only
          test "$(sha256sum "$root/index.html" | cut -d' ' -f1)" = "$baseline"
          if ! python3 "$stage/safe-release.py" activate --state "$state"; then
            python3 "$stage/safe-release.py" rollback --state "$state"
            exit 1
          fi
          REMOTE
