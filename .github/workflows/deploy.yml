name: Publish the overseas text contrast fixes

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/codex/contrast-overseas-rollout'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 638f1310a0a5f418cec1bdfd277a57a09e94ac6d
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: npm
      - run: npm ci
      - name: Build the reviewed overseas frontend
        run: |
          set -eu
          npm run build:web:overseas
          echo '4a8b6216833a2fb4f5200a7717fbd99a37cce38a7ff3ea8d6b44234c4e7b01ef  dist/frontend/index.html' | sha256sum -c -
          cat > "$RUNNER_TEMP/activate.sh" <<'REMOTE'
          set -euo pipefail
          stage="$1"
          state="/var/backups/tsukuyomi-space/releases/$2"
          root=/opt/1panel/www/sites/tsukuyomi-space.com/frontend
          url=https://tsukuyomi-space.com
          before=3acdcf5d066613432e1c85efaf584f132efd458a79d951525275a5bfa5ea3f08
          after=4a8b6216833a2fb4f5200a7717fbd99a37cce38a7ff3ea8d6b44234c4e7b01ef
          actual=$(sha256sum "$root/index.html" | cut -d' ' -f1)
          verify_served() {
            cmp "$stage/frontend/index.html" "$root/index.html" &&
            curl -fsS --retry 4 --retry-all-errors --retry-delay 2 --connect-timeout 7 --max-time 20 --resolve tsukuyomi-space.com:443:127.0.0.1 "$url/assets/index-CjMUw5ap.css" | cmp - "$stage/frontend/assets/index-CjMUw5ap.css" &&
            curl -fsS --retry 4 --retry-all-errors --retry-delay 2 --connect-timeout 7 --max-time 20 --resolve tsukuyomi-space.com:443:127.0.0.1 "$url/api/health" | python3 -c "import json,sys; assert json.load(sys.stdin)['status']=='ok'"
          }
          if [ "$actual" = "$after" ]; then verify_served; exit 0; fi
          test "$actual" = "$before"
          bash "$stage/prepare-lightweight-release.sh" --site overseas --state "$state" --root "$root" --frontend "$root" --artifact "$stage/frontend" --base-url "$url" --resolve tsukuyomi-space.com:443:127.0.0.1 --commit 638f1310a0a5f418cec1bdfd277a57a09e94ac6d --frontend-only
          test "$(sha256sum "$root/index.html" | cut -d' ' -f1)" = "$before"
          if ! python3 "$stage/safe-release.py" activate --state "$state" || ! verify_served; then
            python3 "$stage/safe-release.py" rollback --state "$state"
            exit 1
          fi
          REMOTE
          tar -czf "$RUNNER_TEMP/contrast-release.tgz" -C dist frontend -C "$GITHUB_WORKSPACE/deploy" safe-release.py prepare-lightweight-release.sh -C "$RUNNER_TEMP" activate.sh
      - name: Verify the overseas SSH host
        env:
          SERVER: ${{ secrets.OVERSEAS_SERVER_HOST }}
          PORT: ${{ secrets.OVERSEAS_SERVER_PORT || 47388 }}
        run: |
          command -v sshpass >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq sshpass; }
          ssh-keyscan -T 12 -p "$PORT" -t ed25519 "$SERVER" > "$RUNNER_TEMP/overseas-known-hosts" 2>/dev/null
          test "$(ssh-keygen -lf "$RUNNER_TEMP/overseas-known-hosts" | awk '{print $2}' | sort -u)" = 'SHA256:iWgrq0f82PS81s/NNfMp622ag23vLk83CyHruht53xA'
      - name: Publish and verify the overseas frontend
        env:
          SERVER: ${{ secrets.OVERSEAS_SERVER_HOST }}
          PORT: ${{ secrets.OVERSEAS_SERVER_PORT || 47388 }}
          LOGIN: ${{ secrets.OVERSEAS_SERVER_USER || 'root' }}
          SSHPASS: ${{ secrets.OVERSEAS_SERVER_PASSWORD }}
        run: |
          set -euo pipefail
          opts=(-o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/overseas-known-hosts" -o HostKeyAlgorithms=ssh-ed25519 -o PreferredAuthentications=password -o NumberOfPasswordPrompts=1 -o ConnectTimeout=15)
          for attempt in 1 2 3; do
            label="text-contrast-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$attempt"
            stage="/tmp/tsukuyomi-$label"
            echo "Starting upload and activation (attempt $attempt)"
            if sshpass -e ssh -T "${opts[@]}" -p "$PORT" "$LOGIN@$SERVER" \
              "set -eu; mkdir -m 700 '$stage'; cat > '$stage/release.tgz'; tar -xzf '$stage/release.tgz' -C '$stage'; flock -w 120 /run/lock/tsukuyomi-room-frontend.lock bash '$stage/activate.sh' '$stage' '$label'" \
              < "$RUNNER_TEMP/contrast-release.tgz"; then
              exit 0
            else
              result=$?
            fi
            if [[ "$result" != 255 || "$attempt" == 3 ]]; then exit "$result"; fi
            sleep 8
          done
