name: Publish Room chat recovery overseas

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/codex/room-chat-release-rollout'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 545825dd999b2d9dece16ebd26489e0cedea4d17
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: npm
          cache-dependency-path: source/package-lock.json
      - name: Build and check the release
        working-directory: source
        run: |
          set -eu
          npm ci
          node --test tests/room-wire-frames.test.cjs tests/room-official-api.test.mjs tests/frontend-room-session.test.js
          npm run build:web:overseas
          echo '8f6d6b531a14c1c40f9fe4cf32365308e738b0a029328f2ebdb0ffb654477e36  dist/frontend/index.html' | sha256sum -c -
          cp ../deploy/design-frontend-manifest.json "$RUNNER_TEMP/manifest.json"
          tar -czf "$RUNNER_TEMP/design-frontend.tgz" -C dist frontend -C "$GITHUB_WORKSPACE/source/deploy" safe-release.py prepare-lightweight-release.sh -C "$GITHUB_WORKSPACE/deploy" design-frontend-release.py -C "$RUNNER_TEMP" manifest.json
      - name: Verify the overseas SSH host
        env:
          SERVER: ${{ secrets.OVERSEAS_SERVER_HOST }}
          PORT: ${{ secrets.OVERSEAS_SERVER_PORT || 47388 }}
        run: |
          command -v sshpass >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq sshpass; }
          ssh-keyscan -T 12 -p "$PORT" -t ed25519 "$SERVER" > "$RUNNER_TEMP/overseas-known-hosts" 2>/dev/null
          test "$(ssh-keygen -lf "$RUNNER_TEMP/overseas-known-hosts" | awk '{print $2}' | sort -u)" = 'SHA256:iWgrq0f82PS81s/NNfMp622ag23vLk83CyHruht53xA'
      - name: Publish and verify the overseas frontend
        env:
          SERVER: ${{ secrets.OVERSEAS_SERVER_HOST }}
          PORT: ${{ secrets.OVERSEAS_SERVER_PORT || 47388 }}
          LOGIN: ${{ secrets.OVERSEAS_SERVER_USER || 'root' }}
          SSHPASS: ${{ secrets.OVERSEAS_SERVER_PASSWORD }}
        run: |
          set -euo pipefail
          opts=(-o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/overseas-known-hosts" -o HostKeyAlgorithms=ssh-ed25519 -o PreferredAuthentications=password -o NumberOfPasswordPrompts=1 -o ConnectTimeout=15)
          for attempt in 1 2 3; do
            label="design-frontend-overseas-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$attempt"
            stage="/tmp/tsukuyomi-$label"
            echo "Starting upload and activation (attempt $attempt)"
            if sshpass -e ssh -T "${opts[@]}" -p "$PORT" "$LOGIN@$SERVER" \
              "set -eu; mkdir -m 700 '$stage'; cat > '$stage/release.tgz'; tar -xzf '$stage/release.tgz' -C '$stage'; flock -w 120 /run/lock/tsukuyomi-room-frontend.lock python3 '$stage/design-frontend-release.py' '$stage' '$label'; rm -rf -- '$stage'" \
              < "$RUNNER_TEMP/design-frontend.tgz"; then
              exit 0
            else
              result=$?
            fi
            if [[ "$result" != 255 || "$attempt" == 3 ]]; then exit "$result"; fi
            sleep 8
          done
