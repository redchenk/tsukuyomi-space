name: Guarded Water Mirror rollout
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  pull-requests: read
concurrency:
  group: production-deploy
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/codex/water-mirror-rollout'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify merged and tested source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'CHECK'
          import json, subprocess
          def api(path):
              return json.loads(subprocess.check_output(['gh', 'api', 'repos/redchenk/tsukuyomi-space/' + path]))
          sha = 'cf1b10eeef98741daaeaff640ff22985352676ab'
          old_base = '0a03a7aaf876e0ed22b4216644ea36d5bfb047e7'
          pr = api('pulls/51')
          run = api('actions/runs/42758077348')
          assert pr['merged'] and pr['head']['sha'] == sha and pr['base']['ref'] == 'main'
          assert run['status'] == 'completed' and run['conclusion'] == 'success'
          assert run['event'] == 'workflow_dispatch' and run['head_branch'] == 'codex/water-mirror-checks'
          assert run['head_sha'] == 'c6e57b55f430deaa620438c61256e74862d21dac'
          assert run['path'] == '.github/workflows/deploy.yml'
          jobs = api('actions/runs/42758077348/jobs?per_page=100')['jobs']
          checks = {job['name']: job['conclusion'] for job in jobs}
          expected = {'build'} | {f'chromium ({i})' for i in range(1, 5)} | {f'webkit ({i})' for i in range(1, 4)}
          assert set(checks) == expected and all(result == 'success' for result in checks.values())
          main = api('commits/main')
          assert main['sha'] == pr['merge_commit_sha']
          assert [parent['sha'] for parent in main['parents']] == [old_base]
          assert main['commit']['tree']['sha'] == api('commits/' + sha)['commit']['tree']['sha']
          CHECK
      - name: Download checked builds
        uses: actions/download-artifact@v4
        with:
          name: production-dist
          path: checked-frontend
          run-id: 42758077348
          github-token: ${{ github.token }}
      - name: Prepare deltas from the checked builds
        run: |
          test "$(cat checked-frontend/checked-source.txt)" = 'cf1b10eeef98741daaeaff640ff22985352676ab'
          python3 .water-mirror-release/pack.py checked-frontend
      - name: Upload domestic delta
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: .water-mirror-release/domestic.json,.water-mirror-release/domestic.tgz,.water-mirror-release/publish.py,deploy/safe-release.py
          target: /tmp/tsukuyomi-water-mirror-entry-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify overseas SSH host key
        id: overseas_connection
        env:
          HOST: ${{ secrets.OVERSEAS_SERVER_HOST }}
          PORT: ${{ secrets.OVERSEAS_SERVER_PORT || 47388 }}
        run: |
          set -euo pipefail
          command -v sshpass >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq sshpass; }
          ssh-keyscan -T 10 -t ed25519 -p "$PORT" "$HOST" > "$RUNNER_TEMP/water-mirror-known-hosts" 2>/dev/null
          test "$(ssh-keygen -lf "$RUNNER_TEMP/water-mirror-known-hosts" | awk '{print $2}' | sort -u)" = 'SHA256:iWgrq0f82PS81s/NNfMp622ag23vLk83CyHruht53xA'
      - name: Upload overseas delta
        env:
          HOST: ${{ secrets.OVERSEAS_SERVER_HOST }}
          PORT: ${{ secrets.OVERSEAS_SERVER_PORT || 47388 }}
          LOGIN: ${{ secrets.OVERSEAS_SERVER_USER || 'root' }}
          SSHPASS: ${{ secrets.OVERSEAS_SERVER_PASSWORD }}
        run: |
          set -euo pipefail
          opts=(-o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/water-mirror-known-hosts" -o HostKeyAlgorithms=ssh-ed25519 -o PreferredAuthentications=password -o NumberOfPasswordPrompts=1 -o ConnectTimeout=12)
          stage=/tmp/tsukuyomi-water-mirror-entry-${{ github.run_id }}-${{ github.run_attempt }}
          sshpass -e ssh "${opts[@]}" -p "$PORT" "$LOGIN@$HOST" "umask 077; mkdir -p '$stage/.water-mirror-release'"
          sshpass -e scp "${opts[@]}" -P "$PORT" .water-mirror-release/overseas.json .water-mirror-release/overseas.tgz .water-mirror-release/publish.py deploy/safe-release.py "$LOGIN@$HOST:$stage/.water-mirror-release/"
      - name: Prepare domestic release
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          command_timeout: 6m
          script: |
            set -eu
            stage=/tmp/tsukuyomi-water-mirror-entry-${{ github.run_id }}-${{ github.run_attempt }}
            cp "$stage/deploy/safe-release.py" "$stage/.water-mirror-release/safe-release.py"
            python3 "$stage/.water-mirror-release/publish.py" domestic prepare ${{ github.run_id }}-${{ github.run_attempt }}
      - name: Prepare overseas release
        env:
          HOST: ${{ secrets.OVERSEAS_SERVER_HOST }}
          PORT: ${{ secrets.OVERSEAS_SERVER_PORT || 47388 }}
          LOGIN: ${{ secrets.OVERSEAS_SERVER_USER || 'root' }}
          SSHPASS: ${{ secrets.OVERSEAS_SERVER_PASSWORD }}
        run: |
          set -euo pipefail
          opts=(-o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/water-mirror-known-hosts" -o HostKeyAlgorithms=ssh-ed25519 -o PreferredAuthentications=password -o NumberOfPasswordPrompts=1 -o ConnectTimeout=12)
          stage=/tmp/tsukuyomi-water-mirror-entry-${{ github.run_id }}-${{ github.run_attempt }}
          sshpass -e ssh "${opts[@]}" -p "$PORT" "$LOGIN@$HOST" "python3 '$stage/.water-mirror-release/publish.py' overseas prepare ${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Activate domestic release
        id: activate_domestic
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          command_timeout: 6m
          script: |
            set -eu
            stage=/tmp/tsukuyomi-water-mirror-entry-${{ github.run_id }}-${{ github.run_attempt }}
            cp "$stage/deploy/safe-release.py" "$stage/.water-mirror-release/safe-release.py"
            python3 "$stage/.water-mirror-release/publish.py" domestic activate ${{ github.run_id }}-${{ github.run_attempt }}
      - name: Activate overseas release
        id: activate_overseas
        env:
          HOST: ${{ secrets.OVERSEAS_SERVER_HOST }}
          PORT: ${{ secrets.OVERSEAS_SERVER_PORT || 47388 }}
          LOGIN: ${{ secrets.OVERSEAS_SERVER_USER || 'root' }}
          SSHPASS: ${{ secrets.OVERSEAS_SERVER_PASSWORD }}
        run: |
          set -euo pipefail
          opts=(-o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/water-mirror-known-hosts" -o HostKeyAlgorithms=ssh-ed25519 -o PreferredAuthentications=password -o NumberOfPasswordPrompts=1 -o ConnectTimeout=12)
          stage=/tmp/tsukuyomi-water-mirror-entry-${{ github.run_id }}-${{ github.run_attempt }}
          sshpass -e ssh "${opts[@]}" -p "$PORT" "$LOGIN@$HOST" "python3 '$stage/.water-mirror-release/publish.py' overseas activate ${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Verify domestic release
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          command_timeout: 6m
          script: |
            set -eu
            stage=/tmp/tsukuyomi-water-mirror-entry-${{ github.run_id }}-${{ github.run_attempt }}
            cp "$stage/deploy/safe-release.py" "$stage/.water-mirror-release/safe-release.py"
            python3 "$stage/.water-mirror-release/publish.py" domestic verify ${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify overseas release
        env:
          HOST: ${{ secrets.OVERSEAS_SERVER_HOST }}
          PORT: ${{ secrets.OVERSEAS_SERVER_PORT || 47388 }}
          LOGIN: ${{ secrets.OVERSEAS_SERVER_USER || 'root' }}
          SSHPASS: ${{ secrets.OVERSEAS_SERVER_PASSWORD }}
        run: |
          set -euo pipefail
          opts=(-o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/water-mirror-known-hosts" -o HostKeyAlgorithms=ssh-ed25519 -o PreferredAuthentications=password -o NumberOfPasswordPrompts=1 -o ConnectTimeout=12)
          stage=/tmp/tsukuyomi-water-mirror-entry-${{ github.run_id }}-${{ github.run_attempt }}
          sshpass -e ssh "${opts[@]}" -p "$PORT" "$LOGIN@$HOST" "python3 '$stage/.water-mirror-release/publish.py' overseas verify ${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Verify live HTTPS on both sites
        run: |
          for attempt in 1 2 3; do
            if python3 .water-mirror-release/verify-public.py checked-frontend; then exit 0; fi
            sleep 6
          done
          exit 1
      - name: Rollback overseas release
        if: failure() && steps.activate_overseas.outcome != 'skipped'
        env:
          HOST: ${{ secrets.OVERSEAS_SERVER_HOST }}
          PORT: ${{ secrets.OVERSEAS_SERVER_PORT || 47388 }}
          LOGIN: ${{ secrets.OVERSEAS_SERVER_USER || 'root' }}
          SSHPASS: ${{ secrets.OVERSEAS_SERVER_PASSWORD }}
        run: |
          set -euo pipefail
          opts=(-o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/water-mirror-known-hosts" -o HostKeyAlgorithms=ssh-ed25519 -o PreferredAuthentications=password -o NumberOfPasswordPrompts=1 -o ConnectTimeout=12)
          stage=/tmp/tsukuyomi-water-mirror-entry-${{ github.run_id }}-${{ github.run_attempt }}
          sshpass -e ssh "${opts[@]}" -p "$PORT" "$LOGIN@$HOST" "python3 '$stage/.water-mirror-release/publish.py' overseas rollback ${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Rollback domestic release
        if: failure() && steps.activate_domestic.outcome != 'skipped'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          command_timeout: 6m
          script: |
            set -eu
            stage=/tmp/tsukuyomi-water-mirror-entry-${{ github.run_id }}-${{ github.run_attempt }}
            cp "$stage/deploy/safe-release.py" "$stage/.water-mirror-release/safe-release.py"
            python3 "$stage/.water-mirror-release/publish.py" domestic rollback ${{ github.run_id }}-${{ github.run_attempt }}
      - name: Clean domestic staging
        if: always()
        continue-on-error: true
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -eu
            rm -rf -- /tmp/tsukuyomi-water-mirror-entry-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Clean overseas staging
        if: always() && steps.overseas_connection.outcome == 'success'
        continue-on-error: true
        env:
          HOST: ${{ secrets.OVERSEAS_SERVER_HOST }}
          PORT: ${{ secrets.OVERSEAS_SERVER_PORT || 47388 }}
          LOGIN: ${{ secrets.OVERSEAS_SERVER_USER || 'root' }}
          SSHPASS: ${{ secrets.OVERSEAS_SERVER_PASSWORD }}
        run: |
          set -euo pipefail
          opts=(-o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/water-mirror-known-hosts" -o HostKeyAlgorithms=ssh-ed25519 -o PreferredAuthentications=password -o NumberOfPasswordPrompts=1 -o ConnectTimeout=12)
          stage=/tmp/tsukuyomi-water-mirror-entry-${{ github.run_id }}-${{ github.run_attempt }}
          sshpass -e ssh "${opts[@]}" -p "$PORT" "$LOGIN@$HOST" "rm -rf -- '$stage'"
