name: Publish faster Moon Chat entry overseas

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/codex/moon-chat-overseas-rollout'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Verify the overseas SSH host
        env:
          SERVER: ${{ secrets.OVERSEAS_SERVER_HOST }}
          PORT: ${{ secrets.OVERSEAS_SERVER_PORT || 47388 }}
        run: |
          command -v sshpass >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq sshpass; }
          ssh-keyscan -T 12 -p "$PORT" -t ed25519 "$SERVER" > "$RUNNER_TEMP/overseas-known-hosts" 2>/dev/null
          test "$(ssh-keygen -lf "$RUNNER_TEMP/overseas-known-hosts" | awk '{print $2}' | sort -u)" = 'SHA256:iWgrq0f82PS81s/NNfMp622ag23vLk83CyHruht53xA'
      - name: Publish and verify the overseas frontend
        env:
          SERVER: ${{ secrets.OVERSEAS_SERVER_HOST }}
          PORT: ${{ secrets.OVERSEAS_SERVER_PORT || 47388 }}
          LOGIN: ${{ secrets.OVERSEAS_SERVER_USER || 'root' }}
          SSHPASS: ${{ secrets.OVERSEAS_SERVER_PASSWORD }}
        run: |
          set -euo pipefail
          opts=(-o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/overseas-known-hosts" -o HostKeyAlgorithms=ssh-ed25519 -o PreferredAuthentications=password -o NumberOfPasswordPrompts=1 -o ConnectTimeout=15)
          sshpass -e ssh -T "${opts[@]}" -p "$PORT" "$LOGIN@$SERVER" python3 - <<'CHECK'
          from pathlib import Path
          import re,subprocess
          config=Path('/opt/1panel/www/conf.d/tsukuyomi-space.com.conf').read_text()
          print('Parent API proxy settings:')
          api=config.split('location ^~ /api/ {',1)[1].split('\n    }',1)[0]
          for line in api.splitlines():
           if re.match(r'\s*(proxy_ssl_(name|server_name|verify|verify_depth)|proxy_set_header Host|proxy_pass |error_log )',line): print(line.strip())
          for l in config.splitlines():
           if l.strip().startswith('error_log '):print(l.strip())
          for directory in [Path('/opt/1panel/www/sites/tsukuyomi-space.com/log'),Path('/opt/1panel/www/sites/tsukuyomi-space.com/logs'),Path('/opt/1panel/apps/openresty')]:
           if directory.exists():
            for f in directory.rglob('error.log'):
             with f.open('rb') as h:
              size=f.stat().st_size;h.seek(max(0,size-2000000));lines=h.read().decode(errors='replace').splitlines()
             found=[s.split(', client:')[0] for s in lines if '/api/chatroom/lobby/sync' in s and '09:56:' in s]
             if found: print('Reason:',*found[-4:],sep='\n')
          container=next(x for x in subprocess.check_output(['docker','ps','--format','{{.Names}}'],text=True).splitlines() if x.startswith('1panel-openresty-'))
          s=subprocess.run(['docker','logs','--since','40m',container],capture_output=True,text=True)
          found=[l.split(', client:')[0] for l in (s.stdout+s.stderr).splitlines() if '/api/chatroom/lobby/sync' in l and '[error]' in l]
          if found:print('Container:',*found[-5:],sep='\n')
          direct=['curl','-fsS','--connect-timeout','5','--max-time','12','--connect-to','yachiyo.hk:443:origin.yachiyo.hk:443','-o','/dev/null','-w','%{http_code} %{time_total}','https://yachiyo.hk/api/chatroom/lobby/sync']
          for cmd in [direct,['docker','exec',container,*direct]]:
           result=subprocess.run(cmd,capture_output=True,text=True);print(result.returncode,result.stdout,result.stderr[:250])
          CHECK
