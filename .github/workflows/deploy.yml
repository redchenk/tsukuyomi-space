name: Publish the Room welcome animation overseas

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/codex/room-guide-overseas-rollout'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 829a6e5f6e9eceefbf71a5f4f00e8a87138521da
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: npm
      - run: npm ci
      - name: Build the English site and verify the Room entry artwork
        run: |
          npm run build:web:overseas
          grep -Fq '/assets/index-Dpv8VoJO.js' dist/frontend/index.html
          cmp src/frontend/assets/entry/yachiyo-room-guide.webp dist/frontend/assets/yachiyo-room-guide-XubTRNZr.webp
          cat > "$RUNNER_TEMP/activate.sh" <<'REMOTE'
          set -euo pipefail
          stage="$1"
          state="/var/backups/tsukuyomi-space/releases/$2"
          root=/opt/1panel/www/sites/tsukuyomi-space.com/frontend
          url=https://tsukuyomi-space.com
          baseline=40769931f28a13818b386d1638ef3f3acf6e694e2f9ce7e7c5707b6339eac7e5
          actual=$(sha256sum "$root/index.html" | cut -d' ' -f1)
          if [ "$actual" = "3acdcf5d066613432e1c85efaf584f132efd458a79d951525275a5bfa5ea3f08" ]; then
            cmp "$stage/frontend/assets/yachiyo-room-guide-XubTRNZr.webp" "$root/assets/yachiyo-room-guide-XubTRNZr.webp"
            curl -fsS --resolve tsukuyomi-space.com:443:127.0.0.1 "$url/api/health" | python3 -c "import json,sys; assert json.load(sys.stdin)['status']=='ok'"
            exit 0
          fi
          test "$actual" = "$baseline"
          bash "$stage/prepare-lightweight-release.sh" --site overseas --state "$state" --root "$root" --frontend "$root" --artifact "$stage/frontend" --base-url "$url" --resolve tsukuyomi-space.com:443:127.0.0.1 --commit 829a6e5f6e9eceefbf71a5f4f00e8a87138521da --frontend-only
          test "$(sha256sum "$root/index.html" | cut -d' ' -f1)" = "$baseline"
          if ! python3 "$stage/safe-release.py" activate --state "$state"; then
            python3 "$stage/safe-release.py" rollback --state "$state"
            exit 1
          fi
          REMOTE
          tar -czf "$RUNNER_TEMP/room-entry-release.tgz" -C dist frontend -C "$GITHUB_WORKSPACE/deploy" safe-release.py prepare-lightweight-release.sh -C "$RUNNER_TEMP" activate.sh
      - name: Verify the overseas SSH host
        env:
          SERVER: ${{ secrets.OVERSEAS_SERVER_HOST }}
          PORT: ${{ secrets.OVERSEAS_SERVER_PORT || 47388 }}
        run: |
          command -v sshpass >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq sshpass; }
          ssh-keyscan -T 12 -p "$PORT" -t ed25519 "$SERVER" > "$RUNNER_TEMP/overseas-known-hosts" 2>/dev/null
          test "$(ssh-keygen -lf "$RUNNER_TEMP/overseas-known-hosts" | awk '{print $2}' | sort -u)" = 'SHA256:iWgrq0f82PS81s/NNfMp622ag23vLk83CyHruht53xA'
      - name: Publish and verify the overseas frontend
        env:
          SERVER: ${{ secrets.OVERSEAS_SERVER_HOST }}
          PORT: ${{ secrets.OVERSEAS_SERVER_PORT || 47388 }}
          LOGIN: ${{ secrets.OVERSEAS_SERVER_USER || 'root' }}
          SSHPASS: ${{ secrets.OVERSEAS_SERVER_PASSWORD }}
        run: |
          set -euo pipefail
          opts=(-o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/overseas-known-hosts" -o HostKeyAlgorithms=ssh-ed25519 -o PreferredAuthentications=password -o NumberOfPasswordPrompts=1 -o ConnectTimeout=15)
          for attempt in 1 2 3; do
            label="room-entry-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$attempt"
            stage="/tmp/tsukuyomi-$label"
            echo "Starting upload and activation (attempt $attempt)"
            if sshpass -e ssh -T "${opts[@]}" -p "$PORT" "$LOGIN@$SERVER" \
              "set -eu; mkdir -m 700 '$stage'; cat > '$stage/release.tgz'; tar -xzf '$stage/release.tgz' -C '$stage'; flock -w 120 /run/lock/tsukuyomi-room-frontend.lock bash '$stage/activate.sh' '$stage' '$label'" \
              < "$RUNNER_TEMP/room-entry-release.tgz"; then
              exit 0
            else
              result=$?
            fi
            if [[ "$result" != 255 || "$attempt" == 3 ]]; then exit "$result"; fi
            sleep 8
          done
