name: Water Mirror replay release checks
on: workflow_dispatch
permissions:
  contents: read
concurrency:
  group: water-mirror-replay-release-checks
  cancel-in-progress: false
env:
  ENTRY_CANDIDATE: 1c2a7591b6f3249b47702cde0805061d9f24e153
jobs:
  build:
    if: github.ref == 'refs/heads/codex/water-mirror-replay-checks'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.ENTRY_CANDIDATE }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: npm
      - run: npm ci
      - name: Run unit and deployment safety checks
        run: |
          python3 -m pip install sqlite-vec==0.1.6
          npm test
          python3 -m unittest discover -s tests -p 'deployment_safety_test.py'
      - name: Build domestic and overseas frontend
        run: |
          mkdir -p deployment-artifacts/domestic deployment-artifacts/overseas
          npm run build:web
          cp -a dist/frontend/. deployment-artifacts/domestic/
          npm run build:web:overseas
          cp -a dist/frontend/. deployment-artifacts/overseas/
          test "$(git rev-parse HEAD)" = "$ENTRY_CANDIDATE"
          git rev-parse HEAD > deployment-artifacts/checked-source.txt
      - uses: actions/upload-artifact@v4
        with:
          name: production-dist
          path: deployment-artifacts
          if-no-files-found: error
  chromium:
    if: github.ref == 'refs/heads/codex/water-mirror-replay-checks'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.ENTRY_CANDIDATE }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: npm
      - run: npm ci
      - run: npm run build:web
      - name: Install Chromium and system dependencies
        timeout-minutes: 10
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
          npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --project=chromium --project=chromium-mobile --workers=3 --trace=retain-on-failure tests/e2e/access-transition.spec.js tests/e2e/site-background.spec.js tests/e2e/room-entry.spec.js
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: chromium-failures
          path: test-results
          if-no-files-found: ignore
          retention-days: 3
  webkit:
    if: github.ref == 'refs/heads/codex/water-mirror-replay-checks'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.ENTRY_CANDIDATE }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: npm
      - run: npm ci
      - run: npm run build:web
      - run: npx playwright install webkit
      - run: npm run test:e2e -- --project=webkit-iphone11 --project=webkit-mobile --workers=2 --trace=retain-on-failure tests/e2e/access-transition.spec.js tests/e2e/site-background.spec.js tests/e2e/room-entry.spec.js
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: webkit-failures
          path: test-results
          if-no-files-found: ignore
          retention-days: 3
