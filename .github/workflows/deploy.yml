name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deployment-targets:
    runs-on: ubuntu-latest
    steps:
      - name: Validate domestic and overseas server configuration
        env:
          DOMESTIC_SERVER_HOST: ${{ secrets.SERVER_HOST }}
          OVERSEAS_SERVER_HOST: ${{ secrets.OVERSEAS_SERVER_HOST }}
        run: |
          test -n "$DOMESTIC_SERVER_HOST" || { echo "SERVER_HOST is not configured" >&2; exit 1; }
          test -n "$OVERSEAS_SERVER_HOST" || { echo "OVERSEAS_SERVER_HOST is not configured" >&2; exit 1; }

  check:
    needs: deployment-targets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm test
      - name: Build domestic frontend
        run: |
          npm run build:web
          mkdir -p deployment-artifacts/domestic
          cp -a dist/frontend/. deployment-artifacts/domestic/
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      - name: Build overseas frontend
        run: |
          npm run build:web:overseas
          mkdir -p deployment-artifacts/overseas
          cp -a dist/frontend/. deployment-artifacts/overseas/

      - uses: actions/upload-artifact@v4
        with:
          name: production-dist
          path: deployment-artifacts
          if-no-files-found: error

  deploy:
    needs: check
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 100
          path: deployment-source

      - uses: actions/download-artifact@v4
        with:
          name: production-dist
          path: deployment-artifacts

      - name: Create incremental deployment bundle
        shell: bash
        run: |
          cd deployment-source
          git branch -f codex-deploy "$GITHUB_SHA"
          base="$(git rev-list --first-parent --max-count=100 "$GITHUB_SHA" | tail -1)"
          bundle="../tsukuyomi-deployment-${GITHUB_RUN_ID}.bundle"
          if [ "$base" = "$GITHUB_SHA" ]; then
            git bundle create "$bundle" refs/heads/codex-deploy
          else
            git bundle create "$bundle" refs/heads/codex-deploy "^$base"
          fi
          git bundle verify "$bundle"

      - name: Upload domestic frontend
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: deployment-artifacts/domestic
          target: /tmp/tsukuyomi-prebuilt-${{ github.run_id }}
          overwrite: true

      - name: Upload overseas frontend
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.OVERSEAS_SERVER_HOST }}
          username: ${{ secrets.OVERSEAS_SERVER_USER || secrets.SERVER_USER }}
          key: ${{ secrets.OVERSEAS_SERVER_SSH_KEY || secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.OVERSEAS_SERVER_PORT || 29687 }}
          source: deployment-artifacts/overseas
          target: /tmp/tsukuyomi-prebuilt-${{ github.run_id }}
          overwrite: true

      - name: Upload deployment bundle
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: tsukuyomi-deployment-${{ github.run_id }}.bundle
          target: /tmp
          overwrite: true

      - name: Validate overseas deployment target
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OVERSEAS_SERVER_HOST }}
          username: ${{ secrets.OVERSEAS_SERVER_USER || secrets.SERVER_USER }}
          key: ${{ secrets.OVERSEAS_SERVER_SSH_KEY || secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.OVERSEAS_SERVER_PORT || 29687 }}
          script: |
            set -e
            overseas=/tmp/tsukuyomi-prebuilt-${{ github.run_id }}/deployment-artifacts/overseas
            overseas_root=/opt/1panel/www/sites/tsukuyomi-space.com/frontend
            test -f "$overseas/index.html" || { echo "Overseas frontend artifact is missing" >&2; exit 1; }
            test -d "$overseas_root" || { echo "Overseas frontend directory is missing" >&2; exit 1; }

      - name: Deploy domestic site via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            app=/var/www/tsukuyomi-space
            bundle=/tmp/tsukuyomi-deployment-${{ github.run_id }}.bundle
            prebuilt=/tmp/tsukuyomi-prebuilt-${{ github.run_id }}
            domestic="$prebuilt/deployment-artifacts/domestic"
            case "$prebuilt" in
              /tmp/tsukuyomi-prebuilt-[0-9]*) ;;
              *) echo "Invalid prebuilt path" >&2; exit 1 ;;
            esac
            trap 'rm -f "$bundle"; rm -rf -- "$prebuilt"' EXIT
            test -d "$app" || { echo "Application directory is missing" >&2; exit 1; }
            test -f "$domestic/index.html" || { echo "Domestic frontend artifact is missing" >&2; exit 1; }
            cd "$app"
            git fetch "$bundle" refs/heads/codex-deploy
            test "$(git rev-parse FETCH_HEAD)" = "${{ github.sha }}"
            git -c core.hooksPath=/dev/null merge --ff-only FETCH_HEAD
            install -d -m 0755 "$app/dist/frontend"
            cp -a "$domestic/." "$app/dist/frontend/"
            INSTALL_NGINX_CONFIG=true HARDEN_OPENRESTY_ORIGIN=true bash deploy/deploy.sh

      - name: Deploy overseas site via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OVERSEAS_SERVER_HOST }}
          username: ${{ secrets.OVERSEAS_SERVER_USER || secrets.SERVER_USER }}
          key: ${{ secrets.OVERSEAS_SERVER_SSH_KEY || secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.OVERSEAS_SERVER_PORT || 29687 }}
          script: |
            set -e
            prebuilt=/tmp/tsukuyomi-prebuilt-${{ github.run_id }}
            overseas="$prebuilt/deployment-artifacts/overseas"
            overseas_root=/opt/1panel/www/sites/tsukuyomi-space.com/frontend
            case "$prebuilt" in
              /tmp/tsukuyomi-prebuilt-[0-9]*) ;;
              *) echo "Invalid prebuilt path" >&2; exit 1 ;;
            esac
            trap 'rm -rf -- "$prebuilt"' EXIT
            test -f "$overseas/index.html" || { echo "Overseas frontend artifact is missing" >&2; exit 1; }
            test -d "$overseas_root" || { echo "Overseas frontend directory is missing" >&2; exit 1; }
            cp -a "$overseas/." "$overseas_root/"
