name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deployment-targets:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Validate domestic and overseas server configuration
        env:
          DOMESTIC_SERVER_HOST: ${{ secrets.SERVER_HOST }}
          OVERSEAS_SERVER_HOST: ${{ secrets.OVERSEAS_SERVER_HOST }}
          OVERSEAS_SERVER_PASSWORD: ${{ secrets.OVERSEAS_SERVER_PASSWORD }}
          OVERSEAS_SERVER_SSH_KEY: ${{ secrets.OVERSEAS_SERVER_SSH_KEY }}
        run: |
          test -n "$DOMESTIC_SERVER_HOST" || { echo "SERVER_HOST is not configured" >&2; exit 1; }
          test -n "$OVERSEAS_SERVER_HOST" || { echo "OVERSEAS_SERVER_HOST is not configured" >&2; exit 1; }
          test -n "$OVERSEAS_SERVER_PASSWORD" || test -n "$OVERSEAS_SERVER_SSH_KEY" || {
            echo "OVERSEAS_SERVER_PASSWORD or OVERSEAS_SERVER_SSH_KEY is not configured" >&2
            exit 1
          }

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: npm

      - run: npm ci
      - run: npm test
      - run: python3 -m unittest discover -s tests -p 'deployment_safety_test.py'
      - name: Build and smoke-test Docker runtime
        run: |
          docker build --target runtime -t tsukuyomi-ci:${{ github.sha }} .
          bash tests/docker-smoke.sh tsukuyomi-ci:${{ github.sha }}
      - name: Build domestic frontend
        run: |
          npm run build:web
          mkdir -p deployment-artifacts/domestic
          cp -a dist/frontend/. deployment-artifacts/domestic/
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e

      - name: Build overseas frontend
        run: |
          npm run build:web:overseas
          mkdir -p deployment-artifacts/overseas
          cp -a dist/frontend/. deployment-artifacts/overseas/

      - uses: actions/upload-artifact@v4
        with:
          name: production-dist
          path: deployment-artifacts
          if-no-files-found: error

  deploy:
    needs: [check, deployment-targets]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 100
          path: deployment-source

      - uses: actions/download-artifact@v4
        with:
          name: production-dist
          path: deployment-artifacts

      - name: Create incremental deployment bundle
        shell: bash
        run: |
          cd deployment-source
          git branch -f codex-deploy "$GITHUB_SHA"
          base="$(git rev-list --first-parent --max-count=100 "$GITHUB_SHA" | tail -1)"
          bundle="../tsukuyomi-deployment-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.bundle"
          if [ "$base" = "$GITHUB_SHA" ]; then
            git bundle create "$bundle" refs/heads/codex-deploy
          else
            git bundle create "$bundle" refs/heads/codex-deploy "^$base"
          fi
          git bundle verify "$bundle"

      - name: Upload domestic frontend
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: deployment-artifacts/domestic,deployment-source/deploy/safe-release.py,deployment-source/deploy/prepare-lightweight-release.sh,deployment-source/deploy/prune-release-backups.py
          target: /tmp/tsukuyomi-prebuilt-${{ github.run_id }}-${{ github.run_attempt }}
          overwrite: true

      - name: Upload overseas frontend
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.OVERSEAS_SERVER_HOST }}
          username: ${{ secrets.OVERSEAS_SERVER_USER || 'root' }}
          password: ${{ secrets.OVERSEAS_SERVER_PASSWORD }}
          key: ${{ secrets.OVERSEAS_SERVER_SSH_KEY }}
          port: ${{ secrets.OVERSEAS_SERVER_PORT || 47388 }}
          source: deployment-artifacts/overseas,deployment-source/deploy/safe-release.py,deployment-source/deploy/prepare-lightweight-release.sh,deployment-source/deploy/prune-release-backups.py
          target: /tmp/tsukuyomi-prebuilt-${{ github.run_id }}-${{ github.run_attempt }}
          overwrite: true

      - name: Upload deployment bundle
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: tsukuyomi-deployment-${{ github.run_id }}-${{ github.run_attempt }}.bundle
          target: /tmp
          overwrite: true

      - name: Prepare domestic release
        id: prepare_domestic
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -eu
            stage=/tmp/tsukuyomi-prebuilt-${{ github.run_id }}-${{ github.run_attempt }}
            state=/var/backups/tsukuyomi-space/releases/${{ github.run_id }}-${{ github.run_attempt }}-domestic
            bash "$stage/deployment-source/deploy/prepare-lightweight-release.sh" \
              --site domestic --state "$state" \
              --root /var/www/tsukuyomi-space --frontend /var/www/tsukuyomi-space/dist/frontend \
              --artifact "$stage/deployment-artifacts/domestic" \
              --base-url https://yachiyo.hk --resolve yachiyo.hk:443:127.0.0.1 \
              --bundle /tmp/tsukuyomi-deployment-${{ github.run_id }}-${{ github.run_attempt }}.bundle \
              --commit ${{ github.sha }} --extra-resource /var/www/tsukuyomi-game-assets

      - name: Prepare overseas release
        id: prepare_overseas
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OVERSEAS_SERVER_HOST }}
          username: ${{ secrets.OVERSEAS_SERVER_USER || 'root' }}
          password: ${{ secrets.OVERSEAS_SERVER_PASSWORD }}
          key: ${{ secrets.OVERSEAS_SERVER_SSH_KEY }}
          port: ${{ secrets.OVERSEAS_SERVER_PORT || 47388 }}
          script: |
            set -eu
            stage=/tmp/tsukuyomi-prebuilt-${{ github.run_id }}-${{ github.run_attempt }}
            state=/var/backups/tsukuyomi-space/releases/${{ github.run_id }}-${{ github.run_attempt }}-overseas
            bash "$stage/deployment-source/deploy/prepare-lightweight-release.sh" \
              --site overseas --state "$state" \
              --root /opt/1panel/www/sites/tsukuyomi-space.com/frontend --frontend /opt/1panel/www/sites/tsukuyomi-space.com/frontend \
              --artifact "$stage/deployment-artifacts/overseas" \
              --base-url https://tsukuyomi-space.com --resolve tsukuyomi-space.com:443:127.0.0.1

      - name: Activate domestic release
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -eu
            python3 /tmp/tsukuyomi-prebuilt-${{ github.run_id }}-${{ github.run_attempt }}/deployment-source/deploy/safe-release.py activate \
              --state /var/backups/tsukuyomi-space/releases/${{ github.run_id }}-${{ github.run_attempt }}-domestic

      - name: Activate overseas release
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OVERSEAS_SERVER_HOST }}
          username: ${{ secrets.OVERSEAS_SERVER_USER || 'root' }}
          password: ${{ secrets.OVERSEAS_SERVER_PASSWORD }}
          key: ${{ secrets.OVERSEAS_SERVER_SSH_KEY }}
          port: ${{ secrets.OVERSEAS_SERVER_PORT || 47388 }}
          script: |
            set -eu
            python3 /tmp/tsukuyomi-prebuilt-${{ github.run_id }}-${{ github.run_attempt }}/deployment-source/deploy/safe-release.py activate \
              --state /var/backups/tsukuyomi-space/releases/${{ github.run_id }}-${{ github.run_attempt }}-overseas

      - name: Verify domestic release
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -eu
            python3 /tmp/tsukuyomi-prebuilt-${{ github.run_id }}-${{ github.run_attempt }}/deployment-source/deploy/safe-release.py verify \
              --state /var/backups/tsukuyomi-space/releases/${{ github.run_id }}-${{ github.run_attempt }}-domestic

      - name: Verify overseas release
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OVERSEAS_SERVER_HOST }}
          username: ${{ secrets.OVERSEAS_SERVER_USER || 'root' }}
          password: ${{ secrets.OVERSEAS_SERVER_PASSWORD }}
          key: ${{ secrets.OVERSEAS_SERVER_SSH_KEY }}
          port: ${{ secrets.OVERSEAS_SERVER_PORT || 47388 }}
          script: |
            set -eu
            python3 /tmp/tsukuyomi-prebuilt-${{ github.run_id }}-${{ github.run_attempt }}/deployment-source/deploy/safe-release.py verify \
              --state /var/backups/tsukuyomi-space/releases/${{ github.run_id }}-${{ github.run_attempt }}-overseas

      - name: Rollback overseas release
        if: failure() && steps.prepare_overseas.outcome == 'success'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OVERSEAS_SERVER_HOST }}
          username: ${{ secrets.OVERSEAS_SERVER_USER || 'root' }}
          password: ${{ secrets.OVERSEAS_SERVER_PASSWORD }}
          key: ${{ secrets.OVERSEAS_SERVER_SSH_KEY }}
          port: ${{ secrets.OVERSEAS_SERVER_PORT || 47388 }}
          script: |
            set -eu
            python3 /tmp/tsukuyomi-prebuilt-${{ github.run_id }}-${{ github.run_attempt }}/deployment-source/deploy/safe-release.py rollback \
              --state /var/backups/tsukuyomi-space/releases/${{ github.run_id }}-${{ github.run_attempt }}-overseas

      - name: Rollback domestic release
        if: failure() && steps.prepare_domestic.outcome == 'success'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -eu
            python3 /tmp/tsukuyomi-prebuilt-${{ github.run_id }}-${{ github.run_attempt }}/deployment-source/deploy/safe-release.py rollback \
              --state /var/backups/tsukuyomi-space/releases/${{ github.run_id }}-${{ github.run_attempt }}-domestic

      - name: Prune domestic completed backups
        if: success()
        continue-on-error: true
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            python3 /tmp/tsukuyomi-prebuilt-${{ github.run_id }}-${{ github.run_attempt }}/deployment-source/deploy/prune-release-backups.py --retention 10

      - name: Clean domestic staging
        if: always()
        continue-on-error: true
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            stage=/tmp/tsukuyomi-prebuilt-${{ github.run_id }}-${{ github.run_attempt }}
            case "$stage" in /tmp/tsukuyomi-prebuilt-[0-9]*-[0-9]*) ;; *) exit 1 ;; esac
            rm -rf -- "$stage"
            rm -f -- /tmp/tsukuyomi-deployment-${{ github.run_id }}-${{ github.run_attempt }}.bundle

      - name: Prune overseas completed backups
        if: success()
        continue-on-error: true
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OVERSEAS_SERVER_HOST }}
          username: ${{ secrets.OVERSEAS_SERVER_USER || 'root' }}
          password: ${{ secrets.OVERSEAS_SERVER_PASSWORD }}
          key: ${{ secrets.OVERSEAS_SERVER_SSH_KEY }}
          port: ${{ secrets.OVERSEAS_SERVER_PORT || 47388 }}
          script: |
            python3 /tmp/tsukuyomi-prebuilt-${{ github.run_id }}-${{ github.run_attempt }}/deployment-source/deploy/prune-release-backups.py --retention 10

      - name: Clean overseas staging
        if: always()
        continue-on-error: true
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OVERSEAS_SERVER_HOST }}
          username: ${{ secrets.OVERSEAS_SERVER_USER || 'root' }}
          password: ${{ secrets.OVERSEAS_SERVER_PASSWORD }}
          key: ${{ secrets.OVERSEAS_SERVER_SSH_KEY }}
          port: ${{ secrets.OVERSEAS_SERVER_PORT || 47388 }}
          script: |
            stage=/tmp/tsukuyomi-prebuilt-${{ github.run_id }}-${{ github.run_attempt }}
            case "$stage" in /tmp/tsukuyomi-prebuilt-[0-9]*-[0-9]*) ;; *) exit 1 ;; esac
            rm -rf -- "$stage"
            rm -f -- /tmp/tsukuyomi-deployment-${{ github.run_id }}-${{ github.run_attempt }}.bundle
