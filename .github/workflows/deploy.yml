name: Moonlit Lake queued WebKit shard retry
on: workflow_dispatch
permissions:
  contents: read
concurrency:
  group: moonlit-lake-webkit-retry
  cancel-in-progress: false
env:
  DRIFT_CANDIDATE: e7fca3e8ab9f5a3e975a0ce7d2998cb5db6e8d48
jobs:
  webkit:
    if: github.ref == 'refs/heads/codex/drift-lantern-release-checks'
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        shard: [2]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DRIFT_CANDIDATE }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: npm
      - run: npm ci
      - run: npm run build:web
      - run: npx playwright install webkit
      - run: npm run test:e2e -- --project=webkit-iphone11 --project=webkit-mobile --workers=2 --shard=${{ matrix.shard }}/4 --trace=retain-on-failure
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: webkit-failures-${{ matrix.shard }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 3
