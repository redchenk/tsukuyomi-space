name: Friend Link Monitor

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/friend-links.yml
      - scripts/check-friend-links.js
      - backend/services/friend-link-monitor.js
      - backend/services/outbound-url-security.js
  schedule:
    - cron: '0 5,17 * * *'
    - cron: '30 17 1,7,13,19,25 * *'
  workflow_dispatch:
    inputs:
      task:
        description: Run mode
        required: true
        default: status_only
        type: choice
        options:
          - status_only
          - screenshots_only
          - both
      target_link:
        description: Optional site name, id, or URL
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: friend-link-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Select run mode
        id: mode
        shell: bash
        run: |
          capture=false
          reuse_status=false
          if [ "${{ github.event.schedule }}" = "30 17 1,7,13,19,25 * *" ]; then capture=true; fi
          if [ "${{ inputs.task }}" = "screenshots_only" ]; then capture=true; reuse_status=true; fi
          if [ "${{ inputs.task }}" = "both" ]; then capture=true; fi
          echo "capture=$capture" >> "$GITHUB_OUTPUT"
          echo "reuse_status=$reuse_status" >> "$GITHUB_OUTPUT"

      - name: Check friend links
        shell: bash
        env:
          TARGET_LINK: ${{ inputs.target_link }}
          REUSE_STATUS: ${{ steps.mode.outputs.reuse_status }}
        run: |
          node scripts/check-friend-links.js \
            --source "https://yachiyo.hk/api/friend-links/source?run=${GITHUB_RUN_ID}" \
            --fallback-source "https://tsukuyomi-space.com/api/friend-links/source?run=${GITHUB_RUN_ID}" \
            --output friend-link-results/result.json \
            --reuse-status "$REUSE_STATUS" \
            --target "$TARGET_LINK"

      - name: Install Chromium
        if: steps.mode.outputs.capture == 'true'
        run: npx playwright install --with-deps chromium

      - name: Capture site previews
        if: steps.mode.outputs.capture == 'true'
        run: node scripts/capture-friend-links.js --input friend-link-results/result.json --dir friend-link-results/screenshots

      - uses: actions/upload-artifact@v4
        with:
          name: friend-link-results-${{ github.run_id }}
          path: friend-link-results
          if-no-files-found: error
          retention-days: 10

      - name: Upload results
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: friend-link-results
          target: /tmp/tsukuyomi-friend-links-${{ github.run_id }}
          overwrite: true

      - name: Apply results
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            app=/var/www/tsukuyomi-space
            stage=/tmp/tsukuyomi-friend-links-${{ github.run_id }}
            case "$stage" in
              /tmp/tsukuyomi-friend-links-[0-9]*) ;;
              *) echo "Invalid result path" >&2; exit 1 ;;
            esac
            trap 'rm -rf -- "$stage"' EXIT
            test -f "$stage/friend-link-results/result.json"
            set -a
            . /etc/tsukuyomi-space/tsukuyomi-space.env
            set +a
            db_file="${DB_PATH:-/var/lib/tsukuyomi-space/tsukuyomi.db}"
            node_bin="$(command -v node)"
            runuser -u tsukuyomi -- env -i \
              PATH="$(dirname "$node_bin"):/usr/local/bin:/usr/bin:/bin" \
              HOME=/var/lib/tsukuyomi-space \
              DATA_DIR=/var/lib/tsukuyomi-space \
              DB_PATH="$db_file" \
              "$node_bin" "$app/scripts/apply-friend-link-results.js" \
              --input "$stage/friend-link-results/result.json" \
              --dir "$stage/friend-link-results/screenshots"
