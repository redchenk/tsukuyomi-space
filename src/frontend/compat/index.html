<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="color-scheme" content="light dark"><title>月读空间 · 浏览器检测</title><link rel="stylesheet" href="./probe.css"><script type="module" src="./probe.js"></script></head>
<body><main><a href="/hub">返回月读空间</a><h1>浏览器兼容性检测</h1><p>用于排查夸克、手机自带浏览器及其他浏览器的显示问题。检测仅在本机执行，不上传、不保存任何数据，也不读取账号、密钥或聊天内容。</p><p id="summary" role="status">正在检测…</p><section><h2>视口与输入法</h2><p>点击输入框、收起键盘、旋转屏幕，观察高度是否变化。浏览器无接口时无法判断键盘遮挡。</p><label for="keyboard">输入测试（不会发送）</label><input id="keyboard" type="text" placeholder="点击唤起键盘"><p id="viewport" aria-live="polite"></p></section><section><h2>功能支持</h2><p>这些结果表示接口是否存在，不代表视频、麦克风或实际布局一定正常；浏览器标识也不等于真实内核版本。</p><dl id="features"></dl></section><section><h2>手动反馈</h2><button id="refresh" type="button">重新检测</button> <button id="copy" type="button">复制检测结果</button><p id="copy-status" role="status"></p><textarea id="report" readonly aria-label="检测结果，可手动复制" rows="12" spellcheck="false"></textarea></section></main></body></html>
