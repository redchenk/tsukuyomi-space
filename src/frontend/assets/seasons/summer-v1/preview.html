<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>夏夜花火 · 月读空间素材预览</title>
<style>
*{box-sizing:border-box} :root{color-scheme:light;--ink:#202b46;--muted:#626e84;--surface:#ffffffed;--line:#dfe6f0;--rose:#ad486c;--soft:#f3f6fc;--bg:url(background-light.webp);--veil:linear-gradient(90deg,#f7f9fc40,#f7f9fca0 40%,#f7f9fc50)}
html[data-theme=dark]{color-scheme:dark;--ink:#edf0f7;--muted:#b5bccb;--surface:#222836ed;--line:#394153;--rose:#f3a6bf;--soft:#2c3342;--bg:url(background-dark.webp);--veil:linear-gradient(90deg,#11182744,#11182799 40%,#11182744)}
body{margin:0;padding:24px;color:var(--ink);font:15px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;background:#e6eefc;isolation:isolate}body:before{content:"";position:fixed;inset:0;background:var(--veil),var(--bg) center/cover;z-index:-1}main,header{max-width:1240px;margin:auto}header{display:flex;align-items:center;justify-content:space-between;gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:38px;padding:13px 24px;margin-bottom:24px}header strong{font:600 23px "Songti SC",serif}header small{display:block;color:var(--muted);font-size:11px;letter-spacing:2px}.themes{display:flex;gap:8px}button,.link{font:inherit;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink);padding:8px 17px;cursor:pointer;text-decoration:none}button[aria-pressed=true]{color:var(--rose);background:color-mix(in srgb,var(--rose) 10%,var(--surface));border-color:var(--rose)}button:focus-visible,.link:focus-visible{outline:3px solid #819ce4;outline-offset:3px}
.hero{border-radius:30px;border:1px solid var(--line);overflow:hidden;min-height:430px;position:relative;background:var(--surface)}.hero>img{position:absolute;width:100%;height:100%;object-fit:cover;object-position:72% top}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#fffffff5 0%,#fffffff0 30%,#ffffffa6 48%,#ffffff00 72%)}html[data-theme=dark] .hero:after{background:linear-gradient(90deg,#172132f5,#172132ec 30%,#172132a6 48%,#17213200 72%)}.copy{position:relative;z-index:1;max-width:53%;padding:52px 44px}.eyebrow{letter-spacing:2px;font-size:11px;color:var(--muted)}h1{font:600 clamp(42px,5vw,68px)/1.1 "Songti SC",serif;margin:26px 0 16px}h1 small{display:block;font:400 15px/1.5 "Songti SC",serif;letter-spacing:4px;margin-top:14px}.copy p{color:var(--muted)}.note{margin:22px 0;padding:14px 22px;border:1px solid var(--line);border-radius:24px;background:var(--surface);color:var(--muted)}h2{font:600 27px "Songti SC",serif;margin:28px 0 14px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.card{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:10px;overflow:hidden}.card img{width:100%;height:auto;aspect-ratio:16/9;object-fit:cover;border-radius:17px;display:block}.card figcaption{padding:12px 8px}.card strong{display:block}.card span{display:block;color:var(--muted);font-size:12px}.cutouts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.cutouts figure{margin:0;padding:16px;border:1px solid var(--line);border-radius:24px;overflow:hidden;color:#202b46;background:#f7f9fc}.cutouts figure.dark{background:#172132;color:#edf0f7}.cutouts img{width:100%;height:auto;display:block}.cutouts figcaption{font-size:13px}.footer{margin:25px 0;color:var(--muted);padding:18px;border-radius:24px;background:var(--surface)}
@media(max-width:700px){body{padding:12px}header{padding:12px 17px;gap:8px;border-radius:26px}header strong{font-size:19px}header small{font-size:9px}.themes button{font-size:13px;padding:7px 12px}.hero{min-height:620px;border-radius:24px}.hero>img{height:350px;object-position:75% center;top:0}.hero:after{background:linear-gradient(0deg,#fff 0%,#fff 38%,#ffffff00 65%)}html[data-theme=dark] .hero:after{background:linear-gradient(0deg,#172132 0%,#172132 38%,#17213200 65%)}.copy{max-width:100%;padding:320px 23px 24px}h1{font-size:42px;margin:12px 0}.copy p{margin-bottom:0}.grid{grid-template-columns:1fr 1fr;gap:10px}.card{border-radius:20px;padding:7px}.card img{border-radius:14px}.cutouts{grid-template-columns:1fr}.eyebrow{font-size:9px}.note{font-size:13px;padding:12px 17px}}
</style>
</head>
<body>
<header><div><strong>月读空间</strong><small>SUMMER · 夏夜花火</small></div><nav class="themes" aria-label="预览配色"><button data-theme="light" aria-pressed="true">浅色</button><button data-theme="dark" aria-pressed="false">暗色</button></nav></header>
<main>
<section class="hero" aria-label="夏季 Hero 场景预览"><img src="hero-scene.webp" alt="夏夜湖畔，八千代穿绣球浴衣坐在红纸伞下" width="1672" height="941"><div class="copy"><div class="eyebrow">TSUKUYOMI · A MOONLIT COMMUNITY</div><h1>月读空间<small>Tsukuyomi Space</small></h1><p>盛夏的夜晚，月光依旧温柔。<br>在蝉鸣与烟火之间，与八千代一起把时间慢下来。</p></div></section>
<p class="note">夏季美术素材预览 · 六张素材已生成，春季素材保留。此处的浅色／暗色开关仅用于素材验收。四季主题均已接入网站并完成本地验证。</p>
<h2>素材清单</h2>
<div class="grid">
<figure class="card"><img src="background-light.webp" alt="浅色夏夜湖面与绣球花" width="1672" height="941"><figcaption><strong>浅色背景 · 月光绣球</strong><span>1672 × 941 · 也可用于图库缺省封面</span></figcaption></figure>
<figure class="card"><img src="background-dark.webp" alt="暗色夏夜湖面" width="1672" height="941"><figcaption><strong>暗色背景 · 靛蓝夜色</strong><span>同一地点与构图，夜色更柔和</span></figcaption></figure>
<figure class="card"><img src="hero-scene.webp" alt="夏季八千代完整场景" width="1672" height="941"><figcaption><strong>Hero · 湖畔相伴</strong><span>人物在右侧，配合 CSS 文案遮罩</span></figcaption></figure>
<figure class="card"><img src="sparkler-cover.webp" alt="八千代与手持花火" width="1672" height="941"><figcaption><strong>文章封面 · 夏夜花火</strong><span>蓝白绣球浴衣与暖色星火</span></figcaption></figure>
<figure class="card"><img src="pixel-workshop.webp" alt="夏夜湖畔像素绘画工坊" width="1672" height="941"><figcaption><strong>像素工坊 · 月下创作</strong><span>像素风栅格封面，供卡片与导航使用</span></figcaption></figure>
<figure class="card"><img src="hero-cutout.webp" alt="八千代与纸伞的透明素材" width="1536" height="1024" style="object-fit:contain;background:var(--soft)"><figcaption><strong>透明 Hero · 独立叠放</strong><span>无损 WebP · 保留真实 Alpha</span></figcaption></figure>
</div>
<h2>透明素材叠放检查</h2><div class="cutouts"><figure><img src="hero-cutout.webp" alt="浅底上的透明人物" width="1536" height="1024"><figcaption>月白底 · 细发丝及透明柔光边缘</figcaption></figure><figure class="dark"><img src="hero-cutout.webp" alt="深靛底上的透明人物" width="1536" height="1024"><figcaption>深靛底 · 同一透明素材</figcaption></figure></div>
<p class="footer">使用内置 imagegen 生成。原始 PNG、完整提示词、用途及 SHA-256 清单已保存；网页用 WebP 总计约 3.3 MB。</p>
</main>
<script>document.querySelectorAll('button[data-theme]').forEach(button=>button.addEventListener('click',()=>{document.documentElement.dataset.theme=button.dataset.theme;document.querySelectorAll('button[data-theme]').forEach(item=>item.setAttribute('aria-pressed',String(item===button)));}));</script>
</body></html>
