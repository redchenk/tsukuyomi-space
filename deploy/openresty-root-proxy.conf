proxy_hide_header Content-Security-Policy;
proxy_hide_header Strict-Transport-Security;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header X-Frame-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Permissions-Policy;
proxy_hide_header X-Permitted-Cross-Domain-Policies;
proxy_hide_header Origin-Agent-Cluster;
proxy_hide_header X-XSS-Protection;

location = /api/room/memory/events {
    proxy_pass http://127.0.0.1:3280;
    proxy_http_version 1.1;
    proxy_request_buffering on;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    gzip off;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header Upgrade "";
    proxy_set_header Connection "";
    proxy_set_header Proxy-Connection "";
    proxy_set_header TE "";
    proxy_set_header Trailer "";
    proxy_set_header Transfer-Encoding "";

    add_header X-Accel-Buffering "no" always;
    add_header Cache-Control "private, no-store, no-cache, must-revalidate, no-transform" always;
    include /opt/1panel/www/sites/yachiyo.hk/proxy/_tsukuyomi-security-headers.inc;
}

location / {
    proxy_pass http://127.0.0.1:3280;
    proxy_http_version 1.1;
    proxy_request_buffering on;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;

    proxy_set_header Upgrade "";
    proxy_set_header Connection "";
    proxy_set_header Proxy-Connection "";
    proxy_set_header TE "";
    proxy_set_header Trailer "";
    proxy_set_header Transfer-Encoding "";

    include /opt/1panel/www/sites/yachiyo.hk/proxy/_tsukuyomi-security-headers.inc;
}
