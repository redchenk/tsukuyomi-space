server {
    listen 80;
    listen [::]:80;
    server_name downloads.yachiyo.hk;
    location ^~ /.well-known/acme-challenge/ {
        root /www/sites/tsukuyomi-app-distribution-acme;
        default_type text/plain;
    }
    location / { return 301 https://downloads.yachiyo.hk$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name downloads.yachiyo.hk;
    ssl_certificate /www/sites/tsukuyomi-app-distribution-ssl/fullchain.pem;
    ssl_certificate_key /www/sites/tsukuyomi-app-distribution-ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /www/sites/tsukuyomi-app-distribution/current;
    autoindex off;
    access_log off;
    error_log /var/log/nginx/tsukuyomi-app-distribution.error.log warn;
    add_header X-Content-Type-Options nosniff always;
    location = /releases.json {
        default_type application/json;
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =503;
        limit_except GET HEAD { deny all; }
    }
    location ~ ^/releases/v[0-9A-Za-z.-]+/[0-9A-Za-z._-]+$ {
        default_type application/octet-stream;
        add_header Content-Disposition attachment always;
        add_header Cache-Control "public, max-age=3600, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
        limit_except GET HEAD { deny all; }
    }
    location / { return 404; }
}
