server {
    listen 80;
    listen [::]:80;
    server_name tsukuyomi-space.com www.tsukuyomi-space.com;

    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        default_type text/plain;
        allow all;
    }

    location / {
        return 308 https://tsukuyomi-space.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name tsukuyomi-space.com www.tsukuyomi-space.com;

    root /www/sites/tsukuyomi-space.com/frontend;
    index index.html;
    client_max_body_size 200m;

    ssl_certificate /www/sites/tsukuyomi-space.com/ssl/fullchain.pem;
    ssl_certificate_key /www/sites/tsukuyomi-space.com/ssl/privkey.pem;
    ssl_protocols TLSv1.3 TLSv1.2;
    ssl_session_cache shared:TSUKUYOMI_SSL:10m;
    ssl_session_timeout 10m;
    error_page 497 https://tsukuyomi-space.com$request_uri;

    if ($host = www.tsukuyomi-space.com) {
        return 308 https://tsukuyomi-space.com$request_uri;
    }

    proxy_hide_header Content-Security-Policy;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header X-Permitted-Cross-Domain-Policies;
    proxy_hide_header Origin-Agent-Cluster;
    proxy_hide_header Cross-Origin-Opener-Policy;
    proxy_hide_header Cross-Origin-Resource-Policy;
    proxy_hide_header X-XSS-Protection;
    proxy_hide_header Cache-Control;
    proxy_hide_header Surrogate-Control;

    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        default_type text/plain;
        allow all;
    }

    location = /game-runtime/kaguya-run-ef04c26b4900-r2.html {
        alias /www/sites/tsukuyomi-space.com/frontend/game-assets/kaguya-run-ef04c26b4900.html.gz;
        default_type text/html;
        gzip off;
        etag on;
        add_header Content-Encoding gzip always;
        add_header Content-Disposition "inline; filename=\"kaguya-run-ef04c26b4900.html\"" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /usr/local/openresty/nginx/conf/conf.d/_tsukuyomi-space-game-security-headers.inc;
    }

    location ^~ /en-api/ {
        limit_except GET HEAD { deny all; }
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_buffering on;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        add_header Cache-Control "private, no-store, no-cache, must-revalidate" always;
        add_header Content-Language "en" always;
        include /usr/local/openresty/nginx/conf/conf.d/_tsukuyomi-space-security-headers.inc;
    }

    location = /en-translate {
        limit_except POST { deny all; }
        client_max_body_size 256k;
        client_body_timeout 10s;
        proxy_pass http://127.0.0.1:8790/translate;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        add_header Cache-Control "private, no-store, no-cache, must-revalidate" always;
        add_header Content-Language "en" always;
        include /usr/local/openresty/nginx/conf/conf.d/_tsukuyomi-space-security-headers.inc;
    }

    location = /robots.txt {
        proxy_pass http://127.0.0.1:8790;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Cache-Control "public, max-age=600" always;
        add_header Content-Language "en" always;
        include /usr/local/openresty/nginx/conf/conf.d/_tsukuyomi-space-security-headers.inc;
    }

    location ~ ^/(?:feed\.xml|sitemap\.xml|sitemap-images\.xml)$ {
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Cache-Control "public, max-age=600" always;
        add_header Content-Language "en" always;
        include /usr/local/openresty/nginx/conf/conf.d/_tsukuyomi-space-security-headers.inc;
    }

    location @english_seo {
        set $english_original_uri $request_uri;
        rewrite ^ /seo break;
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Original-URI $english_original_uri;
        add_header Cache-Control "public, max-age=600";
        add_header Content-Language "en" always;
        include /usr/local/openresty/nginx/conf/conf.d/_tsukuyomi-space-security-headers.inc;
    }

    location ^~ /room/shared/ {
        proxy_pass https://yachiyo.hk;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name yachiyo.hk;
        proxy_set_header Host yachiyo.hk;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_cookie_domain .yachiyo.hk tsukuyomi-space.com;
        proxy_cookie_domain yachiyo.hk tsukuyomi-space.com;
        proxy_redirect https://yachiyo.hk/ https://tsukuyomi-space.com/;
        add_header Cache-Control "private, no-store, no-cache, must-revalidate" always;
        add_header Content-Language "en" always;
        include /usr/local/openresty/nginx/conf/conf.d/_tsukuyomi-space-security-headers.inc;
    }

    location = /agent-os {
        proxy_pass https://yachiyo.hk;
        proxy_ssl_server_name on;
        proxy_ssl_name yachiyo.hk;
        proxy_set_header Host yachiyo.hk;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Origin https://yachiyo.hk;
        proxy_set_header Referer https://yachiyo.hk$request_uri;
        proxy_cookie_domain .yachiyo.hk tsukuyomi-space.com;
        proxy_cookie_domain yachiyo.hk tsukuyomi-space.com;
        proxy_redirect https://yachiyo.hk/ https://tsukuyomi-space.com/;
        add_header Cache-Control "private, no-store, no-cache, must-revalidate" always;
        include /usr/local/openresty/nginx/conf/conf.d/_tsukuyomi-space-security-headers.inc;
    }

    location ^~ /agent-os/ {
        proxy_pass https://yachiyo.hk;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name yachiyo.hk;
        proxy_set_header Host yachiyo.hk;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Origin https://yachiyo.hk;
        proxy_set_header Referer https://yachiyo.hk$request_uri;
        proxy_cookie_domain .yachiyo.hk tsukuyomi-space.com;
        proxy_cookie_domain yachiyo.hk tsukuyomi-space.com;
        proxy_redirect https://yachiyo.hk/ https://tsukuyomi-space.com/;
        add_header Cache-Control "private, no-store, no-cache, must-revalidate" always;
        include /usr/local/openresty/nginx/conf/conf.d/_tsukuyomi-space-security-headers.inc;
    }

    location = /live2d-studio {
        return 308 /live2d-studio/;
    }

    location ^~ /live2d-studio/ {
        proxy_pass https://yachiyo.hk;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name yachiyo.hk;
        proxy_set_header Host yachiyo.hk;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cookie_domain .yachiyo.hk tsukuyomi-space.com;
        proxy_cookie_domain yachiyo.hk tsukuyomi-space.com;
        proxy_redirect https://yachiyo.hk/ https://tsukuyomi-space.com/;
        add_header Cache-Control "no-store" always;
        include /usr/local/openresty/nginx/conf/conf.d/_tsukuyomi-space-security-headers.inc;
    }

    location = /api/room/memory/events {
        proxy_pass https://yachiyo.hk;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name yachiyo.hk;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        gzip off;
        proxy_set_header Host yachiyo.hk;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade "";
        proxy_set_header Connection "";
        proxy_set_header Accept-Encoding "";
        proxy_set_header Origin https://yachiyo.hk;
        proxy_set_header Referer https://yachiyo.hk$request_uri;
        proxy_cookie_domain .yachiyo.hk tsukuyomi-space.com;
        proxy_cookie_domain yachiyo.hk tsukuyomi-space.com;
        proxy_redirect https://yachiyo.hk/ https://tsukuyomi-space.com/;
        add_header X-Accel-Buffering "no" always;
        add_header Cache-Control "private, no-store, no-cache, must-revalidate, no-transform" always;
        include /usr/local/openresty/nginx/conf/conf.d/_tsukuyomi-space-security-headers.inc;
    }

    location ^~ /api/ {
        proxy_pass https://yachiyo.hk;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name yachiyo.hk;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        proxy_request_buffering on;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Host yachiyo.hk;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade "";
        proxy_set_header Connection "";
        proxy_set_header Origin https://yachiyo.hk;
        proxy_set_header Referer https://yachiyo.hk$request_uri;
        proxy_cookie_domain .yachiyo.hk tsukuyomi-space.com;
        proxy_cookie_domain yachiyo.hk tsukuyomi-space.com;
        proxy_redirect https://yachiyo.hk/ https://tsukuyomi-space.com/;
        add_header Cache-Control "private, no-store, no-cache, must-revalidate, proxy-revalidate" always;
        add_header Surrogate-Control "no-store" always;
        include /usr/local/openresty/nginx/conf/conf.d/_tsukuyomi-space-security-headers.inc;
    }

    location ^~ /assets/uploads/ {
        proxy_pass https://yachiyo.hk;
        proxy_ssl_server_name on;
        proxy_ssl_name yachiyo.hk;
        proxy_set_header Host yachiyo.hk;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        include /usr/local/openresty/nginx/conf/conf.d/_tsukuyomi-space-security-headers.inc;
    }

    location ^~ /uploads/ {
        proxy_pass https://yachiyo.hk;
        proxy_ssl_server_name on;
        proxy_ssl_name yachiyo.hk;
        proxy_set_header Host yachiyo.hk;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        include /usr/local/openresty/nginx/conf/conf.d/_tsukuyomi-space-security-headers.inc;
    }

    location ^~ /assets/ {
        try_files $uri @origin_static;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        include /usr/local/openresty/nginx/conf/conf.d/_tsukuyomi-space-security-headers.inc;
    }

    location ~ ^/(?:lib|models|models-v3|models-v4)/ {
        try_files $uri @origin_static;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        include /usr/local/openresty/nginx/conf/conf.d/_tsukuyomi-space-security-headers.inc;
    }

    location ~ ^/(?:favicon\.ico|site\.webmanifest|live2d-core\.js)$ {
        try_files $uri @origin_static;
        expires 1d;
        add_header Cache-Control "public, max-age=86400" always;
        include /usr/local/openresty/nginx/conf/conf.d/_tsukuyomi-space-security-headers.inc;
    }

    location @origin_static {
        proxy_pass https://yachiyo.hk;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name yachiyo.hk;
        proxy_set_header Host yachiyo.hk;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /security_best_practices_report.md { return 404; }
    location ~ ^/(?:backend|backups|data|deploy|docs|node_modules|scripts|src|tests)(?:/|$) { return 404; }
    location ^~ /.git { return 404; }
    location ~* \.(?:db|sqlite|sqlite3|env|log)$ { deny all; }

    location = /friend-links {
        error_page 418 = @english_seo;

        # Link checkers cannot execute the SPA, so return rendered anchors.
        if ($http_sec_fetch_mode = "") {
            return 418;
        }
        if ($http_user_agent ~* "(?:googlebot|bingbot|duckduckbot|yandexbot|baiduspider|slurp|facebookexternalhit|twitterbot|linkedinbot)") {
            return 418;
        }

        try_files $uri /index.html;
        add_header Cache-Control "no-store" always;
        add_header Content-Language "en" always;
        include /usr/local/openresty/nginx/conf/conf.d/_tsukuyomi-space-security-headers.inc;
    }

    location / {
        error_page 418 = @english_seo;
        if ($http_user_agent ~* "(?:googlebot|bingbot|duckduckbot|yandexbot|baiduspider|slurp|facebookexternalhit|twitterbot|linkedinbot)") {
            return 418;
        }
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store" always;
        add_header Content-Language "en" always;
        include /usr/local/openresty/nginx/conf/conf.d/_tsukuyomi-space-security-headers.inc;
    }
}
