server {
    include /etc/nginx/snippets/agent-os.conf;
    listen 127.0.0.1:3280 default_server;
    server_name _;

    root /var/www/tsukuyomi-space;
    index index.html;

    client_max_body_size 30m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types
        text/css
        text/plain
        application/javascript
        application/json
        application/octet-stream
        image/svg+xml;

    include /var/www/tsukuyomi-space/deploy/security-headers.inc;

    location ~ ^/api/stats(?:/live/[^/]+)?$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        proxy_hide_header Cache-Control;
        proxy_hide_header Surrogate-Control;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_real_ip;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        add_header Cache-Control "private, no-store, no-cache, must-revalidate, proxy-revalidate" always;
        add_header Surrogate-Control "no-store" always;
        include /var/www/tsukuyomi-space/deploy/security-headers.inc;
    }

    location = /api/room/memory/events {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_real_ip;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Upgrade "";
        proxy_set_header Connection "";
        proxy_set_header Proxy-Connection "";
        proxy_set_header TE "";
        proxy_set_header Trailer "";
        proxy_set_header Transfer-Encoding "";
        proxy_request_buffering on;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        gzip off;
        add_header X-Accel-Buffering "no" always;
        add_header Cache-Control "private, no-store, no-cache, must-revalidate, no-transform" always;
        include /var/www/tsukuyomi-space/deploy/security-headers.inc;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_real_ip;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        proxy_hide_header Cache-Control;
        proxy_hide_header Surrogate-Control;
        add_header Cache-Control "private, no-store, no-cache, must-revalidate, proxy-revalidate" always;
        add_header Surrogate-Control "no-store" always;
        include /var/www/tsukuyomi-space/deploy/security-headers.inc;
    }

    location = /robots.txt {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_real_ip;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_real_ip;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location = /sitemap-images.xml {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_real_ip;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location = /feed.xml {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_real_ip;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    location = /favicon.ico {
        try_files /favicon.ico =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        include /var/www/tsukuyomi-space/deploy/security-headers.inc;
    }

    location = /site.webmanifest {
        try_files /site.webmanifest =404;
        expires 1h;
        add_header Cache-Control "public, max-age=3600" always;
        include /var/www/tsukuyomi-space/deploy/security-headers.inc;
    }

    location = /game-runtime/kaguya-run-ef04c26b4900-r3.html {
        alias /var/www/tsukuyomi-game-assets/kaguya-run-ef04c26b4900.html.gz;
        default_type text/html;
        gzip off;
        etag on;
        add_header Content-Encoding gzip always;
        add_header Content-Disposition "inline; filename=\"kaguya-run-ef04c26b4900.html\"" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /var/www/tsukuyomi-space/deploy/game-security-headers.inc;
    }

    location = /stage {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_real_ip;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location = /article {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_real_ip;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location ^~ /articles/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_real_ip;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location ~ ^/(?:hub|pixel|gallery|friend-links|wiki(?:/(?:characters|terms)/[^/]+)?|game|topics/[^/]+)$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_real_ip;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location ^~ /room/shared/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_real_ip;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        add_header Cache-Control "private, no-store, no-cache, must-revalidate" always;
        include /var/www/tsukuyomi-space/deploy/security-headers.inc;
    }

    location = /pages {
        return 404;
    }

    location ^~ /pages/ {
        return 404;
    }

    location ~* \.html$ {
        return 404;
    }

    location = /room {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        include /var/www/tsukuyomi-space/deploy/security-headers.inc;
        try_files /dist/frontend/index.html =404;
    }

    location = /room/ {
        return 301 /room;
    }

    location = /live2d-studio {
        return 301 /live2d-studio/;
    }

    location = /live2d-studio/ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        include /var/www/tsukuyomi-space/deploy/security-headers.inc;
        try_files /dist/live2d-studio/index.html =404;
    }

    location ^~ /live2d-studio/assets/ {
        alias /var/www/tsukuyomi-space/dist/live2d-studio/assets/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        include /var/www/tsukuyomi-space/deploy/security-headers.inc;
    }

    location = / {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        include /var/www/tsukuyomi-space/deploy/security-headers.inc;
        try_files /dist/frontend/index.html =404;
    }

    location ^~ /assets/uploads/ {
        rewrite ^/assets/uploads/(.*)$ /api/assets/local/$1 last;
    }

    location ^~ /assets/ {
        try_files /dist/frontend$uri $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        include /var/www/tsukuyomi-space/deploy/security-headers.inc;
    }

    location ^~ /assets/music/ {
        types {
            audio/flac flac;
        }
        default_type audio/flac;
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        include /var/www/tsukuyomi-space/deploy/security-headers.inc;
    }

    location ^~ /models-v4/ {
        alias /var/www/tsukuyomi-space/models/;
        gzip on;
        gzip_comp_level 4;
        gzip_min_length 1024;
        gzip_types application/octet-stream;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        include /var/www/tsukuyomi-space/deploy/security-headers.inc;
    }

    location ^~ /models-v3/ {
        alias /var/www/tsukuyomi-space/models/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        include /var/www/tsukuyomi-space/deploy/security-headers.inc;
    }

    location ^~ /models/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        include /var/www/tsukuyomi-space/deploy/security-headers.inc;
    }

    location = /lib/live2dcubismcore-v5.min.js {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        include /var/www/tsukuyomi-space/deploy/security-headers.inc;
    }

    location = /lib/bundled/live2d-room-neuro-live.iife.js {
        try_files $uri =404;
        expires 5m;
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        include /var/www/tsukuyomi-space/deploy/security-headers.inc;
    }

    location = /lib/bundled/live2d-room-neuro-live.20260714-mobile-perf-r5.iife.js {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        include /var/www/tsukuyomi-space/deploy/security-headers.inc;
    }

    location = /lib/bundled/live2d-room-neuro-live.20260717-adaptive-perf-r6.iife.js {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        include /var/www/tsukuyomi-space/deploy/security-headers.inc;
    }

    location = /lib/bundled/live2d-room-neuro-live.20260717-adaptive-perf-r7.iife.js {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        include /var/www/tsukuyomi-space/deploy/security-headers.inc;
    }

    location = /lib/bundled/live2d-room-neuro-live.20260717-adaptive-perf-r8.iife.js {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        include /var/www/tsukuyomi-space/deploy/security-headers.inc;
    }

    location ^~ /lib/ {
        return 404;
    }

    location ~ ^/(?:backend|backups|data|deploy|docs|node_modules|scripts|src|tests)(?:/|$) {
        return 404;
    }

    location ^~ /.git {
        return 404;
    }

    location = /security_best_practices_report.md {
        return 404;
    }

    location = /arena {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Expires "0" always;
        include /var/www/tsukuyomi-space/deploy/security-headers.inc;
        return 301 https://yachiyo.hk/pixel$is_args$args;
    }

    location = /arena/ {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Expires "0" always;
        include /var/www/tsukuyomi-space/deploy/security-headers.inc;
        return 301 https://yachiyo.hk/pixel$is_args$args;
    }

    location / {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        include /var/www/tsukuyomi-space/deploy/security-headers.inc;
        try_files /dist/frontend/index.html =404;
    }

    location ~* \.(?:db|sqlite|sqlite3|env|log)$ {
        deny all;
    }
}
