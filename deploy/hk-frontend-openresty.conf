server {
    listen 80;
    listen [::]:80;
    server_name yachiyo.hk www.yachiyo.hk hk.yachiyo.hk 207.57.132.225;

    root /www/sites/yachiyo-space/frontend;
    index index.html;
    client_max_body_size 50m;

    location ^~ /api/ {
        proxy_pass http://120.24.144.120:3280;
        proxy_http_version 1.1;
        proxy_set_header Host 120.24.144.120:3280;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location ^~ /uploads/ {
        proxy_pass http://120.24.144.120:3280;
        proxy_set_header Host 120.24.144.120:3280;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /assets/music/ {
        try_files $uri @origin_assets;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location ^~ /assets/video/ {
        try_files $uri @origin_assets;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location ^~ /assets/audio/ {
        try_files $uri @origin_assets;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location ^~ /models/ {
        try_files $uri @origin_assets;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location ^~ /lib/ {
        try_files $uri @origin_assets;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location /assets/ {
        try_files $uri @origin_assets;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location @origin_assets {
        proxy_pass http://120.24.144.120:3280;
        proxy_set_header Host 120.24.144.120:3280;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /sitemap.xml {
        proxy_pass http://120.24.144.120:3280;
        proxy_set_header Host 120.24.144.120:3280;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /robots.txt {
        proxy_pass http://120.24.144.120:3280;
        proxy_set_header Host 120.24.144.120:3280;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
