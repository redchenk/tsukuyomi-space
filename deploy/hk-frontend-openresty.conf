server {
    listen 80;
    listen [::]:80;
    server_name yachiyo.hk www.yachiyo.hk hk.yachiyo.hk;

    location ^~ /.well-known/acme-challenge {
        allow all;
        root /usr/share/nginx/html;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name yachiyo.hk www.yachiyo.hk hk.yachiyo.hk;

    root /www/sites/yachiyo-space/frontend;
    index index.html;
    client_max_body_size 200m;

    http2 on;
    ssl_certificate /www/sites/yachiyo.hk/ssl/fullchain.pem;
    ssl_certificate_key /www/sites/yachiyo.hk/ssl/privkey.pem;
    ssl_protocols TLSv1.3 TLSv1.2;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    error_page 497 https://$host$request_uri;
    include /usr/local/openresty/nginx/conf/conf.d/_tsukuyomi-security-headers.inc;

    proxy_hide_header Content-Security-Policy;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header X-Permitted-Cross-Domain-Policies;
    proxy_hide_header Origin-Agent-Cluster;
    proxy_hide_header Cross-Origin-Opener-Policy;
    proxy_hide_header Cross-Origin-Resource-Policy;
    proxy_hide_header X-XSS-Protection;

    if ($http_transfer_encoding != "") {
        return 400;
    }

    location ^~ /.well-known/acme-challenge {
        allow all;
        root /usr/share/nginx/html;
    }

    location = /api/room/memory/events {
        proxy_pass http://__ORIGIN_HOST__:3280;
        proxy_http_version 1.1;
        proxy_request_buffering on;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        gzip off;
        proxy_set_header Host yachiyo.hk;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade "";
        proxy_set_header Connection "";
        proxy_set_header Proxy-Connection "";
        proxy_set_header TE "";
        proxy_set_header Trailer "";
        proxy_set_header Transfer-Encoding "";
        add_header X-Accel-Buffering "no" always;
        add_header Cache-Control "private, no-store, no-cache, must-revalidate, no-transform" always;
        include /usr/local/openresty/nginx/conf/conf.d/_tsukuyomi-security-headers.inc;
    }

    location ^~ /api/ {
        proxy_pass http://__ORIGIN_HOST__:3280;
        proxy_http_version 1.1;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        proxy_hide_header Cache-Control;
        proxy_hide_header Surrogate-Control;
        proxy_set_header Host yachiyo.hk;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade "";
        proxy_set_header Connection "";
        proxy_set_header Proxy-Connection "";
        proxy_set_header TE "";
        proxy_set_header Trailer "";
        proxy_set_header Transfer-Encoding "";
        proxy_request_buffering on;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        add_header Cache-Control "private, no-store, no-cache, must-revalidate, proxy-revalidate" always;
        add_header Surrogate-Control "no-store" always;
        include /usr/local/openresty/nginx/conf/conf.d/_tsukuyomi-security-headers.inc;
    }

    location ^~ /uploads/ {
        proxy_pass http://__ORIGIN_HOST__:3280;
        proxy_set_header Host yachiyo.hk;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /assets/music/ {
        try_files $uri @origin_assets;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        include /usr/local/openresty/nginx/conf/conf.d/_tsukuyomi-security-headers.inc;
    }

    location ^~ /assets/video/ {
        try_files $uri @origin_assets;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        include /usr/local/openresty/nginx/conf/conf.d/_tsukuyomi-security-headers.inc;
    }

    location ^~ /assets/audio/ {
        try_files $uri @origin_assets;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        include /usr/local/openresty/nginx/conf/conf.d/_tsukuyomi-security-headers.inc;
    }

    location ^~ /models-v4/ {
        try_files $uri @origin_assets;
        gzip on;
        gzip_comp_level 4;
        gzip_min_length 1024;
        gzip_types application/octet-stream;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        include /usr/local/openresty/nginx/conf/conf.d/_tsukuyomi-security-headers.inc;
    }

    location ^~ /models-v3/ {
        try_files $uri @origin_assets;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        include /usr/local/openresty/nginx/conf/conf.d/_tsukuyomi-security-headers.inc;
    }

    location ^~ /models/ {
        try_files $uri @origin_assets;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        include /usr/local/openresty/nginx/conf/conf.d/_tsukuyomi-security-headers.inc;
    }

    location = /lib/bundled/live2d-room-neuro-live.iife.js {
        try_files $uri @origin_assets;
        expires 5m;
        add_header Cache-Control "public, max-age=300, must-revalidate";
        include /usr/local/openresty/nginx/conf/conf.d/_tsukuyomi-security-headers.inc;
    }

    location = /lib/bundled/live2d-room-neuro-live.20260714-mobile-perf-r5.iife.js {
        try_files $uri @origin_assets;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        include /usr/local/openresty/nginx/conf/conf.d/_tsukuyomi-security-headers.inc;
    }

    location = /lib/bundled/live2d-room-neuro-live.20260717-adaptive-perf-r6.iife.js {
        try_files $uri @origin_assets;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        include /usr/local/openresty/nginx/conf/conf.d/_tsukuyomi-security-headers.inc;
    }

    location ^~ /lib/ {
        try_files $uri @origin_assets;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        include /usr/local/openresty/nginx/conf/conf.d/_tsukuyomi-security-headers.inc;
    }

    location /assets/ {
        try_files $uri @origin_assets;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        include /usr/local/openresty/nginx/conf/conf.d/_tsukuyomi-security-headers.inc;
    }

    location @origin_assets {
        proxy_pass http://__ORIGIN_HOST__:3280;
        proxy_set_header Host yachiyo.hk;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /sitemap.xml {
        proxy_pass http://__ORIGIN_HOST__:3280;
        proxy_set_header Host yachiyo.hk;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /feed.xml {
        proxy_pass http://__ORIGIN_HOST__:3280;
        proxy_set_header Host yachiyo.hk;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    location = /robots.txt {
        proxy_pass http://__ORIGIN_HOST__:3280;
        proxy_set_header Host yachiyo.hk;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /security_best_practices_report.md {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
