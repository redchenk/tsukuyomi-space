# This file is included inside the public OpenResty server block.
include /opt/1panel/www/sites/yachiyo.hk/proxy/_tsukuyomi-security-headers.inc;

if ($http_x_forwarded_proto = "http") {
    return 308 https://$host$request_uri;
}

if ($http_transfer_encoding != "") {
    return 400;
}

location ^~ /.git {
    return 404;
}

location ^~ /.env {
    return 404;
}

location ^~ /backend/ {
    return 404;
}

location ^~ /backups/ {
    return 404;
}

location ^~ /data/ {
    return 404;
}

location ^~ /deploy/ {
    return 404;
}

location ^~ /node_modules/ {
    return 404;
}

location ^~ /scripts/ {
    return 404;
}

location ^~ /src/ {
    return 404;
}

location ^~ /tests/ {
    return 404;
}

location = /package.json {
    return 404;
}

location = /package-lock.json {
    return 404;
}

location = /docker-compose.yml {
    return 404;
}

location = /Dockerfile {
    return 404;
}

location = /security_best_practices_report.md {
    return 404;
}

location = /actuator/env {
    return 404;
}
